e) {\n    unsigned int x = *state;\n    x ^= x \u003c\u003c 13;\n    x ^= x >> 17;\n    x ^= x \u003c\u003c 5;\n    *state = x;\n    return x;\n}\n\nint pick(const int *weight, int n, int r) {\n    for (int i = 0; i \u003c n; i++) {\n        if (r \u003c weight[i]) {\n            return i;\n        }\n        r -= weight[i];\n    }\n    return n - 1;\n}\n\n// copy tile number `tile` (T x T pixels) from sheet to out, top-left corner at (ox, oy)\nvoid copy_tile(struct Image *out, int ox, int oy, const struct Image *sheet, int tile, int T) {\n    int cols = sheet->w / T;\n    int sx = (tile % cols) * T;\n    int sy = (tile / cols) * T;\n    for (int y = 0; y \u003c T; y++) {\n        for (int x = 0; x \u003c T; x++) {\n            out->px[(oy + y) * out->w + (ox + x)] = sheet->px[(sy + y) * sheet->w + (sx + x)];\n        }\n    }\n}\n\nint main(void) {\n    int T;\n    scanf(\"%d\", &T);\n    struct Image sheet = read_image();\n\n    int mw, mh;\n    unsigned int state;\n    int likes[KINDS][KINDS];\n    scanf(\"%d %d %u\", &mw, &mh, &state);\n    for (int a = 0; a \u003c KINDS; a++) {\n        for (int b = 0; b \u003c KINDS; b++) {\n            scanf(\"%d\", &likes[a][b]);\n        }\n    }\n\n    int *map = malloc(mw * mh * sizeof(int));\n    struct Image out = new_image(mw * T, mh * T);\n\n    for (int my = 0; my \u003c mh; my++) {\n        for (int mx = 0; mx \u003c mw; mx++) {\n            int left = mx > 0 ? map[my * mw + mx - 1] : 0;\n            int up = my > 0 ? map[(my - 1) * mw + mx] : 0;\n\n            int weight[KINDS];\n            int total = 0;\n            for (int k = 0; k \u003c KINDS; k++) {\n                weight[k] = likes[left][k] * likes[up][k];\n                total += weight[k];\n            }\n            int tile = pick(weight, KINDS, next_random(&state) % total);\n\n            map[my * mw + mx] = tile;\n            copy_tile(&out, mx * T, my * T, &sheet, tile, T);\n        }\n    }\n\n    write_image(&out);\n    free(map);\n    free(shee const SAMPLES = [{"id":"list","title":"Linked list","blurb":"Nodes appear on the heap and get chained together. Step through it.","code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\nstruct Node {\n    int value;\n    struct Node *next;\n};\n\nint main(void) {\n    struct Node *head = NULL;\n\n    for (int i = 1; i \u003c= 4; i++) {\n        struct Node *n = malloc(sizeof(struct Node));\n        n->value = i * 10;\n        n->next = head;\n        head = n;\n    }\n\n    for (struct Node *p = head; p != NULL; p = p->next) {\n        printf(\"%d \", p->value);\n    }\n    printf(\"\\n\");\n\n    while (head != NULL) {\n        struct Node *next = head->next;\n        free(head);\n        head = next;\n    }\n    return 0;\n}\n"},{"id":"hanoi","title":"Towers of Hanoi","blurb":"Recursion made visible: watch the stack frames pile up and unwind.","code":"#include \u003cstdio.h>\n\nint moves = 0;\n\nvoid hanoi(int n, char from, char to, char spare) {\n    if (n == 0) {\n        return;\n    }\n    hanoi(n - 1, from, spare, to);\n    moves++;\n    printf(\"move disc %d from %c to %c\\n\", n, from, to);\n    hanoi(n - 1, spare, to, from);\n}\n\nint main(void) {\n    hanoi(3, 'A', 'C', 'B');\n    printf(\"%d moves\\n\", moves);\n    return 0;\n}\n"},{"id":"sort","title":"Bubble sort with swap()","blurb":"Two pointers reach back into main's array on every swap.","code":"#include \u003cstdio.h>\n\nvoid swap(int *a, int *b) {\n    int t = *a;\n    *a = *b;\n    *b = t;\n}\n\nvoid bubble_sort(int *v, int n) {\n    for (int pass = 0; pass \u003c n - 1; pass++) {\n        for (int i = 0; i \u003c n - 1 - pass; i++) {\n            if (v[i] > v[i + 1]) {\n                swap(&v[i], &v[i + 1]);\n            }\n        }\n    }\n}\n\nint main(void) {\n    int v[6] = {31, 4, 15, 9, 26, 5};\n    bubble_sort(v, 6);\n    for (int i = 0; i \u003c 6; i++) {\n        printf(\"%d \", v[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n"},{"id":"strrev","title":"Reverse a string in place","blurb":"Two char pointers walk toward each other from the ends.","code":"#include \u003cstdio.h>\n#include \u003cstring.h>\n\nvoid reverse(char *s) {\n    char *left = s;\n    char *right = s + strlen(s) - 1;\n    while (left \u003c right) {\n        char t = *left;\n        *left = *right;\n        *right = t;\n        left++;\n        right--;\n    }\n}\n\nint main(void) {\n    char word[] = \"stressed\";\n    reverse(word);\n    printf(\"%s\\n\", word);\n    return 0;\n}\n"},{"id":"tree","title":"Binary search tree","blurb":"Insert, walk in order, measure the height, and free it all — every function recursive.","code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\ntypedef struct Tree {\n    int key;\n    struct Tree *left;\n    struct Tree *right;\n} Tree;\n\nTree *insert(Tree *t, int key) {\n    if (t == NULL) {\n        t = malloc(sizeof(Tree));\n        t->key = key;\n        t->left = NULL;\n        t->right = NULL;\n        return t;\n    }\n    if (key \u003c t->key) {\n        t->left = insert(t->left, key);\n    } else {\n        t->right = insert(t->right, key);\n    }\n    return t;\n}\n\nvoid in_order(const Tree *t) {\n    if (t == NULL) return;\n    in_order(t->left);\n    printf(\"%d \", t->key);\n    in_order(t->right);\n}\n\nint height(const Tree *t) {\n    if (t == NULL) return 0;\n    int l = height(t->left);\n    int r = height(t->right);\n    return 1 + (l > r ? l : r);\n}\n\nvoid destroy(Tree *t) {\n    if (t == NULL) return;\n    destroy(t->left);\n    destroy(t->right);\n    free(t);\n}\n\nint main(void) {\n    int keys[] = {50, 30, 70, 20, 40, 60};\n    Tree *root = NULL;\n    for (int i = 0; i \u003c 6; i++) {\n        root = insert(root, keys[i]);\n    }\n    in_order(root);\n    printf(\"\\nheight %d\\n\", height(root));\n    destroy(root);\n    return 0;\n}\n"},{"id":"sieve","title":"Sieve of Eratosthenes","blurb":"A calloc'd array of flags, crossed off in strides.","code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\nint main(void) {\n    int limit = 50;\n    char *composite = calloc(limit + 1, sizeof(char));\n\n    for (int p = 2; p * p \u003c= limit; p++) {\n        if (!composite[p]) {\n            for (int m = p * p; m \u003c= limit; m += p) {\n                composite[m] = 1;\n            }\n        }\n    }\n\n    for (int n = 2; n \u003c= limit; n++) {\n        if (!composite[n]) {\n            printf(\"%d \", n);\n        }\n    }\n    printf(\"\\n\");\n\n    free(composite);\n    return 0;\n}\n"},{"id":"qsort","title":"Sorting records with qsort","blurb":"A comparison function is passed by address and called back for every pair.","code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#include \u003cstring.h>\n\nstruct Planet {\n    char name[8];\n    int moons;\n};\n\nint by_moons(const void *a, const void *b) {\n    const struct Planet *p = a;\n    const struct Planet *q = b;\n    return q->moons - p->moons;\n}\n\nint by_name(const void *a, const void *b) {\n    const struct Planet *p = a;\n    const struct Planet *q = b;\n    return strcmp(p->name, q->name);\n}\n\nvoid show(const struct Planet *ps, int n) {\n    for (int i = 0; i \u003c n; i++) {\n        printf(\"%-8s %d\\n\", ps[i].name, ps[i].moons);\n    }\n}\n\nint main(void) {\n    struct Planet ps[4] = {{\"Mars\", 2}, {\"Earth\", 1}, {\"Neptune\", 16}, {\"Uranus\", 28}};\n\n    qsort(ps, 4, sizeof(struct Planet), by_moons);\n    show(ps, 4);\n    printf(\"--\\n\");\n    qsort(ps, 4, sizeof(struct Planet), by_name);\n    show(ps, 4);\n    return 0;\n}\n"},{"id":"crash","title":"Anatomy of a crash","blurb":"A use-after-free. Run it, then drag the timeline back to see the moment it went wrong.","code":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n#include \u003cstring.h>\n\nstruct User {\n    char name[12];\n    int visits;\n};\n\nint main(void) {\n    struct User *u = malloc(sizeof(struct User));\n    strcpy(u->name, \"margaret\");\n    u->visits = 1;\n\n    struct User *alias = u;     // a second pointer to the same block\n    free(u);                    // the block is given back ...\n\n    alias->visits++;            // ... but alias still points at it\n    printf(\"%s visited %d times\\n\", alias->name, alias->visits);\n    return 0;\n}\n"},{"id":"bits","title":"Bits of a float","blurb":"Reinterpret a float's four bytes as an integer and print its sign, exponent and fraction.","code":"#include \u003cstdio.h>\n#include \u003cstring.h>\n\nvoid show_bits(unsigned int x) {\n    for (int bit = 31; bit >= 0; bit--) {\n        putchar((x >> bit) & 1 ? '1' : '0');\n        if (bit == 31 || bit == 23) {\n            putchar(' ');\n        }\n    }\n    putchar('\\n');\n}\n\nint main(void) {\n    float f = -6.25f;\n    unsigned int raw;\n    memcpy(&raw, &f, sizeof raw);      // copy the bytes, not the value\n\n    show_bits(raw);\n    printf(\"sign %u, exponent %u, fraction 0x%06x\\n\", raw >> 31, (raw >> 23) & 0xFF, raw & 0x7FFFFF);\n    return 0;\n}\n"},{"id":"mandel","title":"A picture from a formula","blurb":"The Mandelbrot set: nobody drew it. Every pixel is the answer to a small loop, and the output is shown as an image.","code":"// The Mandelbrot set. Every pixel stands for a point c of the plane, and the loop asks\n// how long z = z * z + c stays small. Points that never escape are painted black.\n#include \u003cstdio.h>\n\n#define W 36\n#define H 24\n#define LIMIT 30\n\nint escape_time(double cr, double ci) {\n    double zr = 0.0, zi = 0.0;\n    int n = 0;\n    while (n \u003c LIMIT && zr * zr + zi * zi \u003c= 4.0) {\n        double t = zr * zr - zi * zi + cr;\n        zi = 2.0 * zr * zi + ci;\n        zr = t;\n        n++;\n    }\n    return n;\n}\n\nint main(void) {\n    printf(\"P2\\n%d %d\\n255\\n\", W, H);\n    for (int y = 0; y \u003c H; y++) {\n        for (int x = 0; x \u003c W; x++) {\n            double cr = -2.2 + 3.2 * x / W;\n            double ci = -1.2 + 2.4 * y / H;\n            int n = escape_time(cr, ci);\n            printf(\"%d \", n == LIMIT ? 0 : 55 + n * 200 / LIMIT);\n        }\n        printf(\"\\n\");\n    }\n    return 0;\n}\n"},{"id":"life","title":"Game of Life","blurb":"Two grids and one rule about neighbours. A glider crawls across the board, one picture per generation.","code":"// Conway's Game of Life. Every cell lives or dies by counting its eight neighbours.\n// Two grids take turns being \"now\" and \"next\"; each generation is printed as a picture.\n#include \u003cstdio.h>\n#include \u003cstring.h>\n\n#define W 10\n#define H 8\n\nint neighbours(char grid[H][W], int x, int y) {\n    int count = 0;\n    for (int dy = -1; dy \u003c= 1; dy++) {\n        for (int dx = -1; dx \u003c= 1; dx++) {\n            int nx = x + dx, ny = y + dy;\n            if ((dx != 0 || dy != 0) && nx >= 0 && nx \u003c W && ny >= 0 && ny \u003c H) {\n                count += grid[ny][nx];\n            }\n        }\n    }\n    return count;\n}\n\nvoid show(char grid[H][W]) {\n    printf(\"P2\\n%d %d\\n255\\n\", W, H);\n    for (int y = 0; y \u003c H; y++) {\n        for (int x = 0; x \u003c W; x++) {\n            printf(\"%d \", grid[y][x] ? 235 : 25);\n        }\n        printf(\"\\n\");\n    }\n}\n\nint main(void) {\n    char now[H][W] = {0};\n    char next[H][W];\n    now[0][1] = 1;                              // a glider\n    now[1][2] = 1;\n    now[2][0] = 1;\n    now[2][1] = 1;\n    now[2][2] = 1;\n\n    show(now);\n    for (int generation = 0; generation \u003c 8; generation++) {\n        for (int y = 0; y \u003c H; y++) {\n            for (int x = 0; x \u003c W; x++) {\n                int n = neighbours(now, x, y);\n                next[y][x] = n == 3 || (n == 2 && now[y][x]);\n            }\n        }\n        memcpy(now, next, sizeof now);\n        show(now);\n    }\n    return 0;\n}\n"},{"id":"names","title":"A name generator","blurb":"A language model in forty lines: count which letter follows which in a list of names, then draw new names from the counts.","code":"// Training: count which letter follows which in a list of names.\n// Generation: draw new names, letter by letter, from those counts.\n// Change the seed and run again for a different list.\n#include \u003cstdio.h>\n\n#define END 26          // stands for the start and the end of a name\n#define SYMBOLS 27\n\nunsigned int next_random(unsigned int *state) {\n    unsigned int x = *state;\n    x ^= x \u003c\u003c 13;\n    x ^= x >> 17;\n    x ^= x \u003c\u003c 5;\n    *state = x;\n    return x;\n}\n\nint pick(const int *weight, int n, int r) {\n    for (int i = 0; i \u003c n; i++) {\n        if (r \u003c weight[i]) {\n            return i;\n        }\n        r -= weight[i];\n    }\n    return n - 1;\n}\n\nint main(void) {\n    const char *names[] = {\"ada\", \"alan\", \"grace\", \"linus\", \"dennis\", \"ken\", \"bjarne\", \"guido\",\n                           \"margaret\", \"barbara\", \"edsger\", \"donald\", \"niklaus\", \"tim\", \"brian\", \"radia\"};\n    int count = sizeof names / sizeof names[0];\n\n    int follows[SYMBOLS][SYMBOLS] = {0};\n    for (int i = 0; i \u003c count; i++) {\n        int previous = END;\n        for (const char *p = names[i]; *p != '\\0'; p++) {\n            follows[previous][*p - 'a']++;\n            previous = *p - 'a';\n        }\n        follows[previous][END]++;\n    }\n\n    unsigned int state = 1974;                  // the seed\n    for (int i = 0; i \u003c 8; i++) {\n        int current = END;\n        for (int length = 0; length \u003c 12; length++) {\n            int total = 0;\n            for (int k = 0; k \u003c SYMBOLS; k++) {\n                total += follows[current][k];\n            }\n            current = pick(follows[current], SYMBOLS, next_random(&state) % total);\n            if (current == END) {\n                break;\n            }\n            putchar('a' + current);\n        }\n        putchar('\\n');\n    }\n    return 0;\n}\n"},{"id":"blank","title":"Blank program","blurb":"Start from nothing.","code":"#include \u003cstdio.h>\n\nint main(void) {\n\n    return 0;\n}\n"}];
// ===== Grading: runs a learner's program against a lesson's tests and rules (shared by the app and the test suite) =====
const normOut = s => s.replace(/[ \t]+$/gm, '').replace(/\n+$/, '');
const stripComments = s => s.replace(/\/\*[\s\S]*?\*\//g, ' ').replace(/\/\/.*$/gm, '');
const bareSource = s => stripComments(s).replace(/"(\\.|[^"\\\n])*"/g, '""');   // comments and string contents removed, for the source rules
const AST_KEYS = ['body', 'decls', 'init', 'e', 'c', 'a', 'b', 'step', 'cases', 'l', 'r', 'x', 'f', 'args', 'i', 'items'];
function walkAst(n, f) {
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { for (const x of n) walkAst(x, f); return; }
  if (typeof n.e === 'string' || typeof n.s === 'string') f(n);
  for (const k of AST_KEYS) if (n[k] && typeof n[k] === 'object') walkAst(n[k], f);
}
function fnFacts(fn) {                         // what a function's body contains
  const facts = { calls: new Set(), loops: 0, index: 0 };
  walkAst(fn.body, n => {
    if (n.e === 'call' && n.f.e === 'id') facts.calls.add(n.f.name);
    if (n.s === 'while' || n.s === 'for' || n.s === 'do') facts.loops++;
    if (n.e === 'idx') facts.index++;
  });
  return facts;
}
function expectedOutputs(L) {
  if (!L._exp) L._exp = L.tests.map(t => { const r = runC(L.solution, { stdin: t.stdin }); return normOut(r.out || ''); });
  return L._exp;
}
function ruleFailures(L, prog, src, runs) {
  const R = L.rules || {}, out = [], bare = bareSource(src);
  const facts = name => (prog.funcs[name] ? fnFacts(prog.funcs[name]) : null);
  for (const name of R.defines || []) if (!prog.funcs[name]) out.push(`Define a function named ${name}().`);
  for (const name of R.calls || []) if (!runs.some(r => r.stats && r.stats.calls[name])) out.push(`Your program should call ${name}().`);
  for (const name of R.noCalls || []) { let used = false; for (const k in prog.funcs) if (fnFacts(prog.funcs[k]).calls.has(name)) used = true; if (used && !prog.funcs[name]) out.push(`Solve this one without calling ${name}() — writing it yourself is the point.`); }
  if (R.recursive) { const f = facts(R.recursive); if (f && !f.calls.has(R.recursive)) out.push(`${R.recursive}() should call itself — this lesson is about recursion.`); }
  if (R.noLoopsIn) { const f = facts(R.noLoopsIn); if (f && f.loops) out.push(`Write ${R.noLoopsIn}() without a loop — let the recursion do the repeating.`); }
  if (R.noIndexIn) { const f = facts(R.noIndexIn); if (f && f.index) out.push(`In ${R.noIndexIn}(), move a pointer and use * instead of [ ] indexing.`); }
  for (const c of R.noCallsIn || []) { const f = facts(c.fn); if (f) for (const nm of c.names) if (f.calls.has(nm)) out.push(`${c.fn}() should not call ${nm}().`); }
  for (const n of R.needs || []) if (!new RegExp(n.re).test(bare)) out.push(n.msg.charAt(0).toUpperCase() + n.msg.slice(1) + '.');
  for (const n of R.forbids || []) if (new RegExp(n.re).test(bare)) out.push(n.msg.charAt(0).toUpperCase() + n.msg.slice(1) + '.');
  return out;
}
function gradeLesson(L, src) {
  let prog;
  try { prog = compileC(src); } catch (e) { if (e instanceof CErr) return { pass: false, compileError: e, tests: [], ruleFails: [] }; throw e; }
  const want = expectedOutputs(L), tests = [], runs = [];
  L.tests.forEach((t, i) => {
    const m = new Machine(prog, { stdin: t.stdin, maxSteps: 2e6 }).run(), got = normOut(m.out);
    const leaks = m.status === 'done' && !(L.rules && L.rules.allowLeaks) ? m.leaks : [];
    runs.push(m);
    tests.push({ stdin: t.stdin, want: want[i], got, error: m.error || null, leaks, notes: m.notes, ok: m.status === 'done' && got === want[i] && !leaks.length, outOk: got === want[i] });
  });
  const ruleFails = ruleFailures(L, prog, src, runs);
  return { pass: tests.every(t => t.ok) && !ruleFails.length, tests, ruleFails, warnings: prog.warnings };
}

    '</div></div>';
}

// ---------- progress dialog ----------
function openMenu() {
  const dlg = $('#dlg'), slim = () => { const c = Object.assign({}, S); delete c.drafts; return c; };
  const code = () => btoa(unescape(encodeURIComponent(JSON.stringify(slim()))));
  let armed = 0;
  const out = el('textarea', { readonly: true, id: 'backup-out', 'aria-label': 'Backup code' }, code()), inp = el('textarea', { id: 'backup-in', placeholder: 'Paste a backup code here', 'aria-label': 'Backup code to restore' }), msg = el('p', {});
  dlg.replaceChildren(el('div', { class: 'dlg' },
    el('h2', {}, 'Your progress'),
    el('p', {}, `${doneCount()} of ${ALL.length} lessons · ${S.xp} XP · rank: ${rankOf(S.xp)} · ${streakNow()}-day streak`),
    el('hr'),
    el('p', {}, 'Progress lives in this browser only. To move it to another device, or keep a copy, save this backup code.'), out,
    el('div', { class: 'row' }, el('button', { class: 'btn btn-sm', type: 'button', onclick: () => { out.select(); (navigator.clipboard ? navigator.clipboard.writeText(out.value) : Promise.reject()).then(() => { msg.textContent = 'Copied.'; }, () => { msg.textContent = 'Select the code above and copy it.'; }); } }, 'Copy backup code')),
    inp,
    el('div', { class: 'row' }, el('button', { class: 'btn btn-sm', type: 'button', onclick: () => {
      try { const d = JSON.parse(decodeURIComponent(escape(atob(inp.value.trim())))); if (!d || typeof d.done !== 'object') throw 0; S = Object.assign(blank(), d, { drafts: S.drafts }); save(); refreshStats(); msg.textContent = 'Progress restored.'; route(); }
      catch (e) { msg.textContent = 'That is not a valid backup code.'; }
    } }, 'Restore from code'),
    el('button', { class: 'btn btn-sm', type: 'button', onclick: e => { if (Date.now() - armed < 4000) { S = blank(); save(); refreshStats(); msg.textContent = 'All progress erased.'; route(); } else { armed = Date.now(); e.currentTarget.textContent = 'Really erase everything?'; } } }, 'Erase all progress')),
    msg,
    el('div', { class: 'row' }, el('button', { class: 'btn btn-primary', type: 'button', onclick: () => dlg.close() }, 'Close'))));
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}

// ---------- routing ----------
function route() {
  if (bench) { bench.stop(); bench = null; }
  const h = (location.hash || '#map').slice(1), nav = n => $$('.nav a').forEach(a => (a.dataset.nav === n ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  if (h.startsWith('lesson-') && BY_ID[h.slice(7)]) { nav('map'); viewLesson(BY_ID[h.slice(7)]); }
  else if (h === 'arena') { nav('arena'); viewArena(); }
  else if (h === 'play') { nav('play'); viewPlay(); }
  else if (h === 'sheet') { nav('sheet'); viewSheet(); }
  else { nav('map'); viewMap(); }
  view.scrollTop = 0;
}
window.addEventListener('hashchange', route);
$('#btn-menu').addEventListener('click', openMenu);
refreshStats();
route();

})();
</script>
