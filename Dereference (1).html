<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a drafting-table instrument. Cool paper ground, navy ink, hairline rules instead of cards;
   one loud colour — the orange "program counter" — marks whatever the machine is executing right now. */
:root {
  --bg: #e8edf4; --surface: #f6f8fb; --surface-2: #ffffff; --sunk: #dde4ee;
  --ink: #10233f; --ink-2: #47597a; --ink-3: #7888a3; --line: #c3cede; --line-2: #dbe2ec;

  --pc: #e25c07; --pc-soft: #fde6d4; --on-pc: #2a1200;
  --stack: #0a7a74; --stack-soft: #d9efec; --heap: #a03272; --heap-soft: #f5dfeb; --static: #5d6c8c; --static-soft: #e3e7ef;

  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1828; --surface: #12233a; --surface-2: #182d4a; --sunk: #0a1422;
    --ink: #e4ecf8; --ink-2: #a3b5d0; --ink-3: #7389a8; --line: #2c4467; --line-2: #213653;
    --accent: #8cabff; --accent-soft: #1d3565; --on-accent: #0a1730;
    --pc: #ff8f45; --pc-soft: #4a2a12; --on-pc: #2a1200;
    --stack: #5fd4c8; --stack-soft: #123e3f; --heap: #f291c2; --heap-soft: #4a2140; --static: #9fb0cf; --static-soft: #223450;
    --ok: #62d49a; --ok-soft: #123c2c; --warn: #f2b25c; --warn-soft: #45310f; --err: #ff7f8a; --err-soft: #4a1a22;
    --syn-kw: #8cabff; --syn-type: #5fd4c8; --syn-str: #f2b27a; --syn-num: #f291c2; --syn-com: #7389a8; --syn-fn: #e4ecf8; --syn-pre: #d9c27a;

  }
}

  --bg: #0c1828; --surface: #12233a; --surface-2: #182d4a; --sunk: #0a1422;
  --ink: #e4ecf8; --ink-2: #a3b5d0; --ink-3: #7389a8; --line: #2c4467; --line-2: #213653;
  --accent: #8cabff; --accent-soft: #1d3565; --on-accent: #0a1730;
  --pc: #ff8f45; --pc-soft: #4a2a12; --on-pc: #2a1200;
  --stack: #5fd4c8; --stack-soft: #123e3f; --heap: #f291c2; --heap-soft: #4a2140; --static: #9fb0cf; --static-soft: #223450;
  --ok: #62d49a; --ok-soft: #123c2c; --warn: #f2b25c; --warn-soft: #45310f; --err: #ff7f8a; --err-soft: #4a1a22;
  --syn-kw: #8cabff; --syn-type: #5fd4c8; --syn-str: #f2b27a; --syn-num: #f291c2; --syn-com: #7389a8; --syn-fn: #e4ecf8; --syn-pre: #d9c27a;

*, *::before, *::after { box-sizing: border-box; }

#app { height: 100%; display: flex; flex-direction: column; }
#view { flex: 1; min-height: 0; overflow: auto; }

/* ---------- top bar ---------- */
.top { flex: none; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; padding-block: 8px; padding-left: var(--gut-l); padding-right: var(--gut-r); background: var(--surface); border-bottom: 1px solid var(--line); }

.nav { display: flex; gap: 2px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 7px; padding: 7px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; white-space: nowrap; }

.btn-sm { padding: 4px 10px; font-size: 13px; }

/* ---------- prose ---------- */
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 66ch; }
.prose code { background: var(--sunk); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }
.prose pre { margin: 0; background: var(--sunk); border: 1px solid var(--line-2); border-radius: 6px; padding: 10px 12px; font-size: 13px; line-height: 1.5; overflow-x: auto; }
.prose pre code { background: none; padding: 0; font-size: inherit; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag-clinic { border-color: var(--err); color: var(--err); } .tag-xp { font-family: var(--mono); text-transform: none; letter-spacing: 0; }
.tag-ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }

/* ---------- map ---------- */
.page { padding-block: 28px 56px; padding-left: var(--gut-l); padding-right: var(--gut-r); max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px 40px; align-items: end; }
.hero h1 { font-size: clamp(32px, 5.2vw, 54px); font-weight: 800; letter-spacing: -0.03em; }
.hero h1 em { font-style: normal; color: var(--pc); }
.hero .lead { color: var(--ink-2); font-size: 16.5px; max-width: 54ch; margin-top: 14px; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; align-items: center; }
.gauge { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--surface); }
.gauge > div { padding: 12px 14px; border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); min-width: 0; }
.gauge > div:nth-child(2n) { border-right: 0; } .gauge > div:nth-last-child(-n+2) { border-bottom: 0; }
.gauge b { display: block; font-family: var(--mono); font-size: 24px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.gauge span { font-size: 12.5px; color: var(--ink-2); }
.gauge .bar { height: 4px; background: var(--sunk); margin-top: 8px; } .gauge .bar i { display: block; height: 100%; background: var(--accent); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.section-h h2 { font-size: 22px; } .section-h p { color: var(--ink-2); font-size: 14px; }
.units { display: flex; flex-direction: column; }
.unit { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 10px 28px; padding: 18px 0; border-bottom: 1px solid var(--line-2); }
.unit-side .addr { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.unit-side h3 { font-size: 20px; margin: 2px 0 4px; }
.unit-side p { font-size: 13.5px; color: var(--ink-2); }
.unit-side .prog { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-top: 8px; display: inline-block; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); padding: 1px 0 0 1px; align-content: start; }
.cell { position: relative; margin: -1px 0 0 -1px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; padding: 8px 10px 9px; min-height: 86px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cell:hover { background: var(--surface-2); border-color: var(--ink-3); z-index: 1; }
.cell .ix { font-family: var(--mono); font-size: 11px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 6px; }
.cell .ttl { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.cell .meta { margin-top: auto; font-size: 11px; color: var(--ink-3); font-family: var(--mono); display: flex; justify-content: space-between; }
.cell.done { background: var(--accent-soft); }
.cell.done .ix b { color: var(--accent); }
.cell.next { border-color: var(--pc); z-index: 2; box-shadow: inset 0 0 0 1px var(--pc); }
.cell.next .ix b { color: var(--pc); }
.cell.fix .meta span:first-child { color: var(--err); }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.promo { border: 1px solid var(--line); background: var(--surface); padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.promo h3 { font-size: 19px; } .promo p { color: var(--ink-2); font-size: 14px; flex: 1; }
.zoo { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); padding: 1px 0 0 1px; }
.spec { margin: -1px 0 0 -1px; border: 1px solid var(--line); padding: 10px 12px; background: var(--surface); min-width: 0; }
.spec h4 { margin: 0; font-family: var(--mono); font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.spec p { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.spec:not(.got) { color: var(--ink-3); background: transparent; } .spec:not(.got) p { color: var(--ink-3); }
.spec.got h4 span { color: var(--err); }
.foot { color: var(--ink-3); font-size: 12.5px; }

/* ---------- workspace ---------- */
.ws { height: 100%; display: grid; grid-template-columns: minmax(300px, 0.85fr) minmax(400px, 1.3fr) minmax(320px, 1fr); }
.ws > * { min-width: 0; min-height: 0; }
.col-text { overflow: auto; padding: 18px 20px 40px var(--gut-l); border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 18px; }
.col-code { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface-2); }
.col-mem { overflow: auto; background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; padding-right: var(--gut-r); position: relative; }
.lesson-head { display: flex; flex-direction: column; gap: 6px; }
.lesson-head .crumbs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lesson-head h1 { font-size: 28px; }
.lesson-nav { display: flex; gap: 6px; margin-left: auto; }
.block { display: flex; flex-direction: column; gap: 8px; }
.block > h2 { font-family: var(--body); font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.cite { border: 1px solid var(--line); padding: 10px 12px; font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); }
.cite .sec { font-family: var(--mono); font-size: 12px; color: var(--ink); font-weight: 600; display: block; margin-bottom: 3px; }
.world { font-size: 14px; color: var(--ink-2); }
.task { border: 1px solid var(--ink); padding: 12px 14px; background: var(--surface-2); }
.task .prose { gap: 10px; }
.remember { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--ink-2); }
.remember li { padding-left: 16px; position: relative; } .remember li::before { content: "*"; position: absolute; left: 0; color: var(--pc); font-family: var(--mono); font-weight: 600; }
.quiz .q { font-weight: 500; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 7px 10px; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; display: flex; gap: 10px; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--ink-3); }
.opt .k { color: var(--ink-3); flex: none; } .opt.text { font-family: var(--body); font-size: 14px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); } .opt.wrong { border-color: var(--err); background: var(--err-soft); }
.opt:disabled { cursor: default; opacity: 1; color: var(--ink); }
.why { font-size: 13.5px; color: var(--ink-2); }
.hintlist { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.hintlist p { background: var(--warn-soft); border: 1px solid var(--warn); padding: 7px 10px; border-radius: 6px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.passed { border: 1px solid var(--ok); background: var(--ok-soft); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.passed h2 { font-size: 20px; color: var(--ok); }
.side-list { display: flex; flex-direction: column; }
.side-item { text-align: left; border: 0; border-bottom: 1px solid var(--line-2); background: none; padding: 9px 2px; display: flex; flex-direction: column; gap: 1px; }
.side-item:hover:not(:disabled) b { color: var(--accent); }
.side-item b { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.side-item span { font-size: 12.5px; color: var(--ink-2); }
.side-item[aria-current="true"] b { color: var(--pc); }
.side-item:disabled { cursor: default; color: var(--ink-3); } .side-item:disabled span { color: var(--ink-3); }

/* ---------- editor ---------- */
.ed-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line-2); min-height: 40px; }
.ed-head .file { font-family: var(--mono); font-size: 12.5px; font-weight: 600; margin-right: auto; display: flex; gap: 8px; align-items: center; }
.ed { flex: 1 1 0; min-height: 180px; overflow: auto; background: var(--surface-2); display: grid; grid-template-columns: auto minmax(0, 1fr); align-content: start; font-family: var(--mono); font-size: 13px; line-height: 20px; tab-size: 4; }
.ed-gutter { position: sticky; left: 0; z-index: 2; background: var(--surface-2); color: var(--ink-3); text-align: right; padding: 10px 0; user-select: none; border-right: 1px solid var(--line-2); min-width: 40px; }
.ed-gutter div { padding: 0 8px 0 10px; height: 20px; cursor: default; font-variant-numeric: tabular-nums; }
.debug .ed-gutter div { cursor: pointer; } .debug .ed-gutter div:hover { color: var(--pc); }
.ed-gutter .cur { background: var(--pc); color: var(--on-pc); font-weight: 600; }
.ed-gutter .err { background: var(--err); color: var(--surface-2); font-weight: 600; }
.ed-gutter .wrn { box-shadow: inset 3px 0 0 var(--warn); }
.ed-main { position: relative; min-width: max-content; }
.ed-hl, .ed-ta { margin: 0; padding: 10px 14px 10px 12px; font: inherit; line-height: inherit; tab-size: 4; white-space: pre; letter-spacing: 0; border: 0; }
.ed-hl { position: relative; pointer-events: none; min-height: 100%; color: var(--ink); z-index: 1; }
.ed-ta { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; overflow: hidden; background: transparent; color: transparent; caret-color: var(--ink); outline: none; z-index: 1; -webkit-text-fill-color: transparent; }
.ed-ta::selection { background: var(--accent-soft); }
.ed-band { position: absolute; left: 0; right: 0; height: 20px; pointer-events: none; z-index: 0; }
.ed-band.cur { background: var(--pc-soft); } .ed-band.err { background: var(--err-soft); }
.t-kw { color: var(--syn-kw); font-weight: 500; } .t-ty { color: var(--syn-type); font-weight: 500; } .t-str { color: var(--syn-str); } .t-num { color: var(--syn-num); }
.t-com { color: var(--syn-com); font-style: italic; } .t-fn { color: var(--syn-fn); font-weight: 600; } .t-pre { color: var(--syn-pre); }

/* ---------- run bar / timeline / io ---------- */
.runbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); flex-wrap: wrap; background: var(--surface); }
.runbar .spacer { flex: 1; }
.tl { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--line-2); background: var(--surface); flex-wrap: wrap; }
.tl input[type=range] { flex: 1 1 140px; min-width: 100px; accent-color: var(--pc); height: 20px; }
.tl .pos { font-family: var(--mono); font-size: 12px; color: var(--ink-2); min-width: 15ch; text-align: right; font-variant-numeric: tabular-nums; }
.io { flex: 0 0 34%; min-height: 150px; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line-2); background: var(--surface); padding: 0 6px; }
.tabs button { border: 0; background: none; padding: 7px 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pc); }
.tabs .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--err); } .tabs .dot.ok { background: var(--ok); }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.console { margin: 0; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.console:empty::before { content: attr(data-empty); color: var(--ink-3); font-family: var(--body); }
.exit { font-size: 12px; color: var(--ink-3); font-family: var(--mono); }
.diag { border: 1px solid var(--err); background: var(--err-soft); padding: 9px 11px; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; border-radius: 6px; }

  def('labs', T.long, 'n', a => numv(T.long, a[0].v < 0 ? -BigInt(a[0].v) : BigInt(a[0].v)));
  def('rand', T.int, '', function () { this.seed = (Math.imul(this.seed, 1103515245) + 12345) & 0x7fffffff; return I((this.seed >> 16) & 0x7fff); });

  def('assert', T.void, 'a', function (a, l) { if (a[0].v == 0) this.err(`assertion failed on line ${l}: the condition inside assert( ) was false`, 'assert', l); });
  def('qsort', T.void, 'pnnp', function (a, l) {
    const base = a[0].v, n = N(a[1]), sz = N(a[2]), name = this.fnAt[a[3].v];
    if (!name) this.err('qsort needs a comparison function as its fourth argument', 'type', l);
    const fn = this.prog.funcs[name]; if (fn.params.length !== 2) this.err(`qsort's comparison function must take two pointers, but ${name}() takes ${fn.params.length} argument(s)`, 'type', l);
    this.range(base, n * sz, true, l, 'qsort');
    const tmp = new Uint8Array(sz), ti = new Uint8Array(sz);
    for (let i = 1; i < n; i++) for (let j = i; j > 0; j--) {      // insertion sort: simple, and every comparison is a real call

      this.u8.copyWithin(x, y, y + sz); this.ini.copyWithin(x, y, y + sz); this.u8.set(tmp, y); this.ini.set(ti, y);
    }
  });
  for (const [k, f] of Object.entries({ isdigit: c => c >= 48 && c <= 57, isalpha: c => (c | 32) >= 97 && (c | 32) <= 122, isalnum: c => (c >= 48 && c <= 57) || ((c | 32) >= 97 && (c | 32) <= 122),
    isspace: isWs, isupper: c => c >= 65 && c <= 90, islower: c => c >= 97 && c <= 122, ispunct: c => c > 32 && c < 127 && !((c >= 48 && c <= 57) || ((c | 32) >= 97 && (c | 32) <= 122)),
    isprint: c => c >= 32 && c < 127, isxdigit: c => (c >= 48 && c <= 57) || ((c | 32) >= 97 && (c | 32) <= 102) })) def(k, T.int, 'n', a => I(f(N(a[0])) ? 1 : 0));
  def('toupper', T.int, 'n', a => { const c = N(a[0]); return I(c >= 97 && c <= 122 ? c - 32 : c); });

  for (const k of ['sqrt', 'fabs', 'floor', 'ceil', 'sin', 'cos', 'tan', 'exp', 'log', 'log10', 'log2', 'atan', 'asin', 'acos', 'trunc', 'cbrt', 'sinh', 'cosh', 'tanh'])

// One-call helper: compile and run, never throws for user errors.
function runC(src, o = {}) {
  let prog;
  try { prog = compileC(src); } catch (e) { if (e instanceof CErr) return { compileError: e, out: '', warnings: [] }; throw e; }
  const m = new Machine(prog, o).run();
  return { m, prog, out: m.out, status: m.status, error: m.error, exit: m.exit, leaks: m.leaks || [], notes: m.notes, warnings: prog.warnings, steps: m.steps, stats: m.stats };
}

const COURSE = [{"id":"first","title":"Hello, machine","blurb":"Output, variables, input and the arithmetic every program is built from.","lessons":[{"id":"hello","title":"Your first program","xp":15,"kind":"code","rules":{},"hints":["Each call to printf writes exactly the characters between its quotes, so a second line needs a second printf (or a second \\n).","Add this line before return: printf(\"I speak C now.\\n\");"],"remember":["Every statement ends with `;`","Text for printf lives in \"double quotes\", and `\\n` ends the line"],"intro":"A C program is a list of **functions**, and the machine always starts at the one called `main`. Inside `main`, statements run from top to bottom, and each one ends with a semicolon.\n\n`printf` writes text to the screen. The text goes between double quotes, and `\\n` means \"start a new line\" — without it, the next output continues on the same line.\n\n`#include \u003cstdio.h>` tells the compiler that `printf` exists. `return 0;` at the end of `main` reports to the operating system that everything went well.\n\nPress **Run** to execute the program below, or **Step** to walk through it one statement at a time.","ref":{"sec":"C17 §5.1.2.2.1 Program startup","text":"The function called when a program starts is named main. Returning from main ends the program, and a return value of 0 reports successful termination to the host environment."},"world":"The exit code is real: shells, build systems and CI servers read the number that main returns to decide whether your program succeeded. `return 0` is why a green tick appears.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    printf(\"A\");\n    printf(\"B\\n\");\n    printf(\"C\");\n    return 0;\n}\n","options":["A B C","AB\nC","A\nB\nC","ABC"],"answer":1,"why":"printf never adds a newline by itself. Only the \\n after B moves to the next line, so the output is AB on the first line and C on the second."},"task":"Make the program print exactly these two lines:\n```\nHello, machine!\nI speak C now.\n```","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    printf(\"Hello, machine!\\n\");\n    // print the second line here\n\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    printf(\"Hello, machine!\\n\");\n    printf(\"I speak C now.\\n\");\n    return 0;\n}\n","tests":[{"stdin":""}],"explain":"Two statements, executed in order. The machine does not guess where lines end: every newline in the output is a `\\n` you wrote."},{"id":"variables","title":"Boxes with names","xp":15,"kind":"code","rules":{"needs":[{"re":"area\\s*=[^=;]*(width|height)","msg":"compute area from width and height instead of typing the number"},{"re":"perimeter\\s*=[^=;]*(width|height)","msg":"compute perimeter from width and height instead of typing the number"}]},"hints":["Multiplication is written with *. Assign with a single = : area = width * height;","perimeter = 2 * width + 2 * height;  — multiplication happens before addition, as in school."],"remember":["`int name = value;` creates and fills a box in one step","`%d` in a printf format is a placeholder for an int"],"intro":"A **variable** is a named box in memory. `int width = 7;` asks for a box big enough for an integer (4 bytes on this machine), names it `width`, and stores 7 in it.\n\nYou can read a box as often as you like and overwrite it with `=`. Note that `=` means \"store the value on the right into the box on the left\" — it is an action, not a statement of equality.\n\nTo print a number, put `%d` in the format text; printf replaces it with the value that follows the comma.\n\nA box that has never been assigned holds whatever bytes happened to be there before. Run the starter program and look at what the machine says, then press **Step** and watch the boxes appear in the stack panel.","ref":{"sec":"C17 §6.7.9 Initialization","text":"If an object with automatic storage duration is not initialised explicitly, its value is indeterminate. Using an indeterminate value is one of the behaviours the standard leaves undefined."},"world":"Uninitialised variables are a classic source of bugs that appear only sometimes, because the leftover bytes differ from run to run. Compilers warn about them with -Wall, and tools such as Valgrind and MemorySanitizer exist largely to catch them.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    int x = 3;\n    x = x + 4;\n    printf(\"%d\", x);\n    return 0;\n}\n","options":["3","4","7","34"],"answer":2,"why":"The right side is computed first: x + 4 is 7. Then = stores 7 back into x, replacing the 3."},"task":"The room is 7 wide and 6 high. Store the area (width × height) in `area` and the perimeter (twice the width plus twice the height) in `perimeter`, so the program prints:\n```\narea=42 perimeter=26\n```\nCompute the values from `width` and `height` rather than typing 42 and 26.","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    int width = 7;\n    int height = 6;\n    int area;\n    int perimeter;\n\n    // give area and perimeter their values here\n\n    printf(\"area=%d perimeter=%d\\n\", area, perimeter);\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    int width = 7;\n    int height = 6;\n    int area;\n    int perimeter;\n\n    area = width * height;\n    perimeter = 2 * width + 2 * height;\n\n    printf(\"area=%d perimeter=%d\\n\", area, perimeter);\n    return 0;\n}\n","tests":[{"stdin":""}],"explain":"The starter failed because `area` was read before anything had been stored in it. On a real computer that prints an arbitrary leftover number; this machine refuses and tells you which box was empty."},{"id":"input","title":"Listening","xp":20,"kind":"code","rules":{},"hints":["A printf format may contain several %d placeholders; the values after the comma fill them from left to right.","printf(\"%d + %d = %d\\n\", a, b, a + b);"],"remember":["`scanf(\"%d\", &n)` — the & gives scanf the address to store into","printf takes values; scanf takes addresses"],"intro":"`scanf` is the mirror image of printf: it reads characters that the user typed and converts them. `scanf(\"%d\", &n);` reads one whole number and stores it in `n`.\n\nThe `&` matters. scanf has to **change** your variable, so it needs to know **where the variable lives** — its address in memory. `&n` means \"the address of n\". Leave the & out and scanf receives a copy of n's current value, which is of no use to it. (This idea returns in the Pointers unit, where it becomes the main event.)\n\nIn this app, the text the program will read is in the **Input** box under the editor. Each test supplies different input, so the program has to work for any numbers.","ref":{"sec":"C17 §7.21.6.2 The fscanf function","text":"Each conversion stores its result in the object pointed to by the corresponding argument. With %d, input white space is skipped, then an optionally signed decimal integer is read; the function returns the number of items it assigned."},"world":"scanf is how small tools and programming-contest solutions read their input. Larger programs usually read whole lines with fgets and parse them, because scanf gives up at the first character it does not expect.","quiz":{"q":"Why is there an & in scanf(\"%d\", &n)?","code":null,"options":["It tells scanf where n lives, so scanf can store the number there","It converts n into text","It is optional and only there for readability","It means \"and\", joining the format to the variable"],"answer":0,"why":"Function arguments are copies. To let scanf modify your variable you hand it the variable's address instead of its value."},"task":"Read two whole numbers and print their sum in this form:\n```\n3 + 4 = 7\n```","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    int a, b;\n    scanf(\"%d\", &a);\n    // read b the same way, then print:  a + b = sum\n\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    int a, b;\n    scanf(\"%d\", &a);\n    scanf(\"%d\", &b);\n    printf(\"%d + %d = %d\\n\", a, b, a + b);\n    return 0;\n}\n","tests":[{"stdin":"3 4\n"},{"stdin":"-10 25\n"},{"stdin":"0 0\n"},{"stdin":"123456 654321\n"}],"explain":"The third value handed to printf is an expression, `a + b`. Anything that produces an int can fill a `%d`."},{"id":"arithmetic","title":"Whole-number arithmetic","xp":20,"kind":"code","rules":{},"hints":["There are 3600 seconds in an hour. total / 3600 is the number of whole hours; total % 3600 is what remains after removing them.","minutes = (total % 3600) / 60;  and  seconds = total % 60;"],"remember":["int / int throws the fraction away","`a % b` is what is left after dividing a by b"],"intro":"With `int` values, the five arithmetic operators are `+`, `-`, `*`, `/` and `%`.\n\nDivision of two ints gives an int: the fractional part is thrown away. `17 / 5` is `3`, not 3.4.\n\n`%` gives the remainder of that division: `17 % 5` is `2`, because 17 = 3 × 5 + 2. Division and remainder are a pair — one tells you how many whole groups fit, the other tells you what is left over.\n\n`*`, `/` and `%` are applied before `+` and `-`. Use parentheses when you want a different order.","ref":{"sec":"C17 §6.5.5 Multiplicative operators","text":"When integers are divided, the result is the algebraic quotient with any fractional part discarded (truncation toward zero). If a/b is representable, (a/b)*b + a%b equals a."},"world":"Splitting a quantity with / and % is everywhere: seconds into hours and minutes, a byte offset into a page number and a position within the page, an index into a row and a column.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    printf(\"%d %d\", 17 / 5, 17 % 5);\n    return 0;\n}\n","options":["3.4 2","3 2","4 2","3 5"],"answer":1,"why":"5 fits into 17 three whole times (15), leaving a remainder of 2."},"task":"Read a number of seconds and print it as hours, minutes and seconds:\n```\n7384  →  2h 3m 4s\n```","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    int total;\n    scanf(\"%d\", &total);\n\n    int hours = 0;\n    int minutes = 0;\n    int seconds = 0;\n    // work out hours, minutes and seconds from total\n\n    printf(\"%dh %dm %ds\\n\", hours, minutes, seconds);\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    int total;\n    scanf(\"%d\", &total);\n\n    int hours = total / 3600;\n    int minutes = (total % 3600) / 60;\n    int seconds = total % 60;\n\n    printf(\"%dh %dm %ds\\n\", hours, minutes, seconds);\n    return 0;\n}\n","tests":[{"stdin":"7384\n"},{"stdin":"59\n"},{"stdin":"3600\n"},{"stdin":"86399\n"}],"explain":"`/` asks \"how many whole ones?\" and `%` asks \"what is left?\". Applying them in turn peels a number apart, largest unit first."},{"id":"types","title":"Not everything is an int","xp":25,"kind":"code","rules":{},"hints":["(a + b + c) is an int and 3 is an int, so the division throws the fraction away before the result ever reaches the double.","Make one side of the division a double: divide by 3.0, or write (double)(a + b + c) / 3."],"remember":["The types of the operands decide the kind of division, not the type of the variable receiving the result","`%d` for int, `%f` for double, `%c` for char"],"intro":"C has several number types, and each box has a fixed size. On this machine:\n\n- `char` — 1 byte, a small integer usually used for one character, written `'A'`\n- `int` — 4 bytes, whole numbers up to about 2 billion\n- `long` — 8 bytes, much larger whole numbers\n- `double` — 8 bytes, numbers with a fractional part such as `3.25`\n\nWhen an operation mixes an int and a double, the int is converted to double first. But `7 / 2` involves two ints, so it is integer division and gives `3` — even if the result is then stored in a double.\n\nA **cast** converts on purpose: `(double)sum / 3` turns `sum` into a double before dividing. Writing `3.0` instead of `3` has the same effect.\n\nPrint a double with `%f`, or `%.2f` for two decimal places. Print a char with `%c`.","ref":{"sec":"C17 §6.3.1.8 Usual arithmetic conversions","text":"If one operand of an arithmetic operator has type double, the other operand is converted to double; otherwise integer operands stay integers. Converting a floating value to an integer type discards the fractional part (§6.3.1.4)."},"world":"Integer division where real division was meant is one of the most common bugs in numeric code: averages come out too low, percentages collapse to 0. Reviewers learn to look twice at every `/` between two ints.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    double d = 7 / 2;\n    printf(\"%.1f\", d);\n    return 0;\n}\n","options":["3.5","3.0","3","4.0"],"answer":1,"why":"7 and 2 are both ints, so 7 / 2 is computed as an int: 3. Only afterwards is 3 converted to the double 3.0."},"task":"Read three whole numbers and print their average with two decimal places:\n```\n3 4 6  →  average = 4.33\n```\nThe starter program runs, but its answer is wrong. Find out why.","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    int a, b, c;\n    scanf(\"%d %d %d\", &a, &b, &c);\n\n    double average = (a + b + c) / 3;\n\n    printf(\"average = %.2f\\n\", average);\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    int a, b, c;\n    scanf(\"%d %d %d\", &a, &b, &c);\n\n    double average = (a + b + c) / 3.0;\n\n    printf(\"average = %.2f\\n\", average);\n    return 0;\n}\n","tests":[{"stdin":"3 4 6\n"},{"stdin":"1 2 2\n"},{"stdin":"10 10 10\n"},{"stdin":"0 0 1\n"}],"explain":"One character changed: `3` became `3.0`. That makes the division a double division, so the fraction survives."}]},{"id":"flow","title":"Decisions and loops","blurb":"Making the machine choose a path and repeat itself.","lessons":[{"id":"if","title":"Choosing a path","xp":20,"kind":"code","rules":{},"hints":["After the closing brace of the if block you can continue with: else if (n == 0) { ... } else { ... }","Only one branch of an if / else if / else chain ever runs: the first one whose condition is true."],"remember":["`==` compares, `=` assigns","Zero is false; everything else is true"],"intro":"An `if` runs its block only when the condition in the parentheses is true. An `else` block runs when it was false, and `else if` chains further tests.\n\nComparisons are `\u003c`, `>`, `\u003c=`, `>=`, `==` (equal) and `!=` (not equal). C has no special true/false values here: a comparison produces the int `1` for true and `0` for false, and **any non-zero value counts as true**.\n\nCombine conditions with `&&` (and), `||` (or) and `!` (not).\n\nThe trap everyone falls into once: `=` assigns, `==` compares. `if (x = 0)` stores 0 in x and then tests that 0 — which is false.","ref":{"sec":"C17 §6.8.4.1 The if statement","text":"The first substatement is executed if the controlling expression compares unequal to 0. With an else, the second substatement is executed if the expression compares equal to 0."},"world":"In 2003 someone tried to slip a backdoor into the Linux kernel with exactly this trick: a line that looked like a check `== 0` was really an assignment `= 0` to the user id, which would have granted root. It was noticed and removed before it reached a release.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    int x = 5;\n    if (x = 0)\n        printf(\"zero\");\n    else\n        printf(\"nonzero\");\n    return 0;\n}\n","options":["zero","nonzero","nothing","5"],"answer":1,"why":"x = 0 is an assignment. It stores 0 in x and its value is 0, which counts as false, so the else branch runs."},"task":"Read a whole number and print one word describing it: `negative`, `zero` or `positive`.","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n\n    if (n > 0) {\n        printf(\"positive\\n\");\n    }\n    // handle zero and negative numbers too\n\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n\n    if (n > 0) {\n        printf(\"positive\\n\");\n    } else if (n == 0) {\n        printf(\"zero\\n\");\n    } else {\n        printf(\"negative\\n\");\n    }\n\n    return 0;\n}\n","tests":[{"stdin":"12\n"},{"stdin":"0\n"},{"stdin":"-5\n"},{"stdin":"-2147483648\n"}],"explain":"The final `else` needs no condition: if n is neither greater than nor equal to zero, negative is the only possibility left."},{"id":"while","title":"Again and again","xp":25,"kind":"code","rules":{},"hints":["n % 10 is the last digit. n / 10 is the number with that digit removed. When n reaches 0 there are no digits left.","while (n > 0) { sum += n % 10; n /= 10; }"],"remember":["The condition is tested before every pass, including the first","Make sure each pass brings the loop closer to stopping"],"intro":"`while (condition) { ... }` checks the condition, runs the block if it is true, then goes back and checks again. It stops the first time the condition is false — which may be before the block has run even once.\n\nSomething inside the block must move the program toward the exit. If the condition can never become false, the loop runs forever.\n\nStep through a loop and watch the highlighted line jump back to the `while` each time round, with the variables changing in the stack panel.\n\nA useful pattern for taking a number apart: `n % 10` is its last digit, and `n / 10` removes that digit.","ref":{"sec":"C17 §6.8.5.1 The while statement","text":"The controlling expression is evaluated before each execution of the loop body, and the body is executed repeatedly until the expression compares equal to 0."},"world":"Every long-running program is a while loop at heart: a web server loops \"while there are connections\", a game loops \"while the player has not quit\", an operating system loops until power-off.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    int i = 0;\n    while (i \u003c 3) {\n        printf(\"x\");\n        i++;\n    }\n    printf(\"%d\", i);\n    return 0;\n}\n","options":["xx2","xxx2","xxx3","xxxx4"],"answer":2,"why":"The body runs for i = 0, 1 and 2. After the third pass i is 3, the test 3 \u003c 3 fails, and the loop ends with i still 3."},"task":"Read a whole number that is zero or greater and print the sum of its digits:\n```\n1234  →  10\n```","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n\n    int sum = 0;\n    // while n still has digits: add the last digit to sum, then remove it\n\n    printf(\"%d\\n\", sum);\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n\n    int sum = 0;\n    while (n > 0) {\n        sum += n % 10;\n        n /= 10;\n    }\n\n    printf(\"%d\\n\", sum);\n    return 0;\n}\n","tests":[{"stdin":"1234\n"},{"stdin":"0\n"},{"stdin":"99999\n"},{"stdin":"7\n"},{"stdin":"1000000\n"}],"explain":"`sum += x` is short for `sum = sum + x`, and `n /= 10` for `n = n / 10`. Each pass consumes one digit, so the loop is guaranteed to end."},{"id":"for","title":"Counting loops","xp":25,"kind":"code","rules":{},"hints":["i is a multiple of 3 exactly when i % 3 == 0.","Test for \"both\" first. If you test for 3 first, 15 is caught by that branch and never reaches the FizzBuzz test."],"remember":["for (start; condition; step) — separated by semicolons","A variable declared in the for header exists only inside the loop"],"intro":"Most loops count. A `for` loop puts the three parts of counting on one line:\n\n```c\nfor (int i = 1; i \u003c= 5; i++) {\n    printf(\"%d\\n\", i);\n}\n```\n\nThe first part runs once, before anything else. The middle part is the condition, tested before every pass. The last part runs after every pass. The three parts are separated by **semicolons**.\n\nIt does exactly what the equivalent while loop does; it is just harder to forget the `i++`.","ref":{"sec":"C17 §6.8.5.3 The for statement","text":"In for (clause-1; expression-2; expression-3), clause-1 is evaluated once before the first test, expression-2 is the controlling expression evaluated before each execution of the body, and expression-3 is evaluated after each execution of the body."},"world":"FizzBuzz, the task below, became famous as a job-interview filter: a surprising number of applicants for programming jobs cannot write it. The whole trick is deciding the order of the tests.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    for (int i = 10; i > 0; i -= 3)\n        printf(\"%d \", i);\n    return 0;\n}\n","options":["10 7 4","10 7 4 1","10 7 4 1 -2","7 4 1"],"answer":1,"why":"i takes the values 10, 7, 4 and 1. The next value would be -2, and -2 > 0 is false, so the loop stops before printing it."},"task":"Read a number n and print the numbers from 1 to n, one per line — except:\n\n- for multiples of 3 print `Fizz`\n- for multiples of 5 print `Buzz`\n- for multiples of both print `FizzBuzz`","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n\n    for (int i = 1; i \u003c= n; i++) {\n        printf(\"%d\\n\", i);\n    }\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n\n    for (int i = 1; i \u003c= n; i++) {\n        if (i % 15 == 0) {\n            printf(\"FizzBuzz\\n\");\n        } else if (i % 3 == 0) {\n            printf(\"Fizz\\n\");\n        } else if (i % 5 == 0) {\n            printf(\"Buzz\\n\");\n        } else {\n            printf(\"%d\\n\", i);\n        }\n    }\n    return 0;\n}\n","tests":[{"stdin":"15\n"},{"stdin":"5\n"},{"stdin":"1\n"},{"stdin":"31\n"}],"explain":"The order of an if / else if chain is part of its logic: the most specific case has to come first."},{"id":"nested","title":"Loops inside loops","xp":30,"kind":"code","rules":{},"hints":["d divides candidate exactly when candidate % d == 0.","for (int d = 2; d \u003c candidate; d++) { if (candidate % d == 0) { is_prime = 0; break; } }"],"remember":["break leaves only the innermost loop","The inner loop restarts from the beginning on every outer pass"],"intro":"A loop body can contain anything, including another loop. For every single pass of the outer loop, the inner loop runs from start to finish.\n\nTwo statements change a loop's course:\n\n- `break` leaves the innermost loop immediately\n- `continue` skips the rest of the body and goes straight to the next pass\n\nA common shape is a search with a flag: assume the answer is yes, loop looking for a counter-example, and `break` as soon as one is found.","ref":{"sec":"C17 §6.8.6.3 The break statement","text":"A break statement terminates execution of the smallest enclosing switch or iteration statement. A continue statement (§6.8.6.2) jumps to the end of the body of the smallest enclosing loop."},"world":"Nested loops are how programs walk grids: pixels of an image, cells of a spreadsheet, squares of a game board. They are also the first place to look when a program is slow, since the inner body runs rows × columns times.","quiz":{"q":"How many stars does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    for (int i = 0; i \u003c 4; i++)\n        for (int j = 0; j \u003c i; j++)\n            printf(\"*\");\n    return 0;\n}\n","options":["****","****************","******","***"],"answer":2,"why":"The inner loop runs i times: 0 times, then 1, 2 and 3 times. That is 0 + 1 + 2 + 3 = 6 stars."},"task":"Read a number n and print every prime number from 2 up to n on one line, separated by spaces:\n```\n20  →  2 3 5 7 11 13 17 19\n```\nA prime has no divisor other than 1 and itself.","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n\n    for (int candidate = 2; candidate \u003c= n; candidate++) {\n        int is_prime = 1;\n        // look for a divisor between 2 and candidate - 1;\n        // if you find one, set is_prime to 0 and stop looking\n\n        if (is_prime) {\n            printf(\"%d \", candidate);\n        }\n    }\n    printf(\"\\n\");\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n\n    for (int candidate = 2; candidate \u003c= n; candidate++) {\n        int is_prime = 1;\n        for (int d = 2; d * d \u003c= candidate; d++) {\n            if (candidate % d == 0) {\n                is_prime = 0;\n                break;\n            }\n        }\n\n        if (is_prime) {\n            printf(\"%d \", candidate);\n        }\n    }\n    printf(\"\\n\");\n    return 0;\n}\n","tests":[{"stdin":"20\n"},{"stdin":"2\n"},{"stdin":"1\n"},{"stdin":"100\n"}],"explain":"The solution stops at `d * d \u003c= candidate`: if a number has a divisor larger than its square root, it also has one smaller, so there is no need to look further. Your version may test every d below candidate — that is correct too, only slower."}]},{"id":"functions","title":"Functions","blurb":"Naming a piece of work, calling it, and what happens on the stack when you do.","lessons":[{"id":"functions","title":"Naming a piece of work","xp":25,"kind":"code","rules":{"defines":["max3"]},"hints":["Keep the best value seen so far in a local variable, starting with a.","int best = a; if (b > best) best = b; if (c > best) best = c; return best;"],"remember":["return type, name, parameters in parentheses, body in braces","Define a function above the code that calls it"],"intro":"A function packages a calculation under a name:\n\n```c\nint square(int x) {\n    return x * x;\n}\n```\n\n`int` before the name is the type of the result. `x` is a **parameter**: a variable that receives a value each time the function is called. `return` ends the function and hands a value back to the caller.\n\nA call such as `square(5)` can be used anywhere a value can: `int y = square(5) + 1;`\n\nC reads a file from top to bottom, so a function has to be declared **above** the place where it is first called. That is why `main` is usually written last.","ref":{"sec":"C17 §6.9.1 Function definitions","text":"On entry to a function, the size of each parameter is determined and each parameter is assigned the value of the corresponding argument. A return statement with an expression returns that value to the caller, converted to the function's return type."},"world":"The whole C standard library is functions of this kind: printf, strlen, sqrt. Programs with millions of lines are built the same way you are about to — small named pieces, each doing one job.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint twice(int x) {\n    return x * 2;\n}\nint main(void) {\n    printf(\"%d\", twice(twice(3)) + 1);\n    return 0;\n}\n","options":["7","12","13","14"],"answer":2,"why":"The inner call twice(3) returns 6. That 6 becomes the argument of the outer call, which returns 12. Then 1 is added."},"task":"Complete `max3` so that it returns the largest of its three arguments. `main` is already written and prints the result.","starter":"#include \u003cstdio.h>\n\nint max3(int a, int b, int c) {\n    // return the largest of a, b and c\n    return a;\n}\n\nint main(void) {\n    int x, y, z;\n    scanf(\"%d %d %d\", &x, &y, &z);\n    printf(\"%d\\n\", max3(x, y, z));\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint max3(int a, int b, int c) {\n    int best = a;\n    if (b > best) best = b;\n    if (c > best) best = c;\n    return best;\n}\n\nint main(void) {\n    int x, y, z;\n    scanf(\"%d %d %d\", &x, &y, &z);\n    printf(\"%d\\n\", max3(x, y, z));\n    return 0;\n}\n","tests":[{"stdin":"1 2 3\n"},{"stdin":"9 2 3\n"},{"stdin":"4 8 1\n"},{"stdin":"-5 -2 -9\n"},{"stdin":"7 7 7\n"}],"explain":"\"Best so far\" is a pattern worth remembering: it works for three values, and — with a loop — for three million."},{"id":"frames","title":"Every call gets its own frame","xp":25,"kind":"code","rules":{"defines":["power"]},"hints":["A for loop that runs exp times, multiplying result by base on each pass.","for (int i = 0; i \u003c exp; i++) { result *= base; }"],"remember":["Parameters are copies of the arguments","Locals live in the frame and disappear when the function returns"],"intro":"Each time a function is called, the machine sets aside a fresh block of memory for that call: its **stack frame**. The frame holds the function's parameters and local variables. When the function returns, the frame is thrown away.\n\nArguments are passed **by value**: the parameter is a new box, filled with a copy. Changing the parameter changes only the copy.\n\nPress **Step** on the program below and watch the stack panel. When `power` is called, a second frame appears on top of main's with its own `base`, `exp` and `result`. When it returns, that frame vanishes and only the returned number survives.","ref":{"sec":"C17 §6.5.2.2 Function calls","text":"In preparing for a call, the arguments are evaluated and each parameter is assigned the value of the corresponding argument. A function may change the values of its parameters, but these changes cannot affect the values of the arguments."},"world":"The call stack is what a debugger shows you as a \"stack trace\" or \"backtrace\" when a program crashes: the chain of frames that were alive at that moment, innermost first.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nvoid reset(int x) {\n    x = 0;\n}\nint main(void) {\n    int n = 5;\n    reset(n);\n    printf(\"%d\", n);\n    return 0;\n}\n","options":["0","5","nothing","50"],"answer":1,"why":"reset receives a copy of n in its own frame. Setting that copy to 0 leaves main's n untouched, and the copy is discarded when reset returns."},"task":"Complete `power` so that it returns `base` multiplied by itself `exp` times. `exp` is zero or greater, and anything to the power 0 is 1.\n```\n2 10  →  1024\n```","starter":"#include \u003cstdio.h>\n\nint power(int base, int exp) {\n    int result = 1;\n    // multiply result by base, exp times\n\n    return result;\n}\n\nint main(void) {\n    int b, e;\n    scanf(\"%d %d\", &b, &e);\n    printf(\"%d\\n\", power(b, e));\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint power(int base, int exp) {\n    int result = 1;\n    for (int i = 0; i \u003c exp; i++) {\n        result *= base;\n    }\n    return result;\n}\n\nint main(void) {\n    int b, e;\n    scanf(\"%d %d\", &b, &e);\n    printf(\"%d\\n\", power(b, e));\n    return 0;\n}\n","tests":[{"stdin":"2 10\n"},{"stdin":"3 0\n"},{"stdin":"-2 3\n"},{"stdin":"7 1\n"},{"stdin":"10 9\n"}],"explain":"`result`, `i`, `base` and `exp` all lived in power's frame. The caller never saw them: the only thing that crossed back was the returned value."},{"id":"recursion","title":"A function that calls itself","xp":30,"kind":"code","rules":{"defines":["gcd"],"recursive":"gcd","noLoopsIn":"gcd"},"hints":["The two bullet points in the task translate directly into an if and a return.","if (b == 0) return a;  return gcd(b, a % b);"],"remember":["Every recursion needs a base case that does not recurse","Each recursive call must work on a smaller problem"],"intro":"A function may call any function — including itself. Each call gets its own frame, so each has its own copy of the parameters.\n\n```c\nint sum_to(int n) {\n    if (n == 0) return 0;          // base case: nothing left to add\n    return n + sum_to(n - 1);      // a smaller version of the same problem\n}\n```\n\nTwo ingredients are essential: a **base case** that answers directly, and a recursive call on a **smaller** problem, so the base case is eventually reached.\n\nStep through a recursive program and watch frames pile up on the stack, then unwind one by one as each call returns to the one below it.\n\nWithout a base case the frames pile up until the stack is full. Try it — this machine stops and explains; a real one crashes with a segmentation fault.","ref":{"sec":"C17 §6.5.2.2 Function calls ¶11","text":"Recursive function calls are permitted, both directly and indirectly through any chain of other functions. Each call creates a new instance of the function's automatic variables (§6.2.4)."},"world":"Euclid's algorithm, the task below, is about 2300 years old and still in daily use: generating an RSA key, the kind that secures much of the web, relies on it.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint f(int n) {\n    if (n == 0) return 0;\n    return n + f(n - 1);\n}\nint main(void) {\n    printf(\"%d\", f(4));\n    return 0;\n}\n","options":["4","6","10","24"],"answer":2,"why":"f(4) is 4 + f(3), which is 4 + 3 + f(2), and so on down to f(0) = 0. In total 4 + 3 + 2 + 1 + 0 = 10."},"task":"The greatest common divisor of two numbers is the largest number that divides both. Euclid's rule:\n\n- `gcd(a, 0)` is `a`\n- otherwise `gcd(a, b)` is `gcd(b, a % b)`\n\nWrite `gcd` as a recursive function, with no loop.\n```\n48 18  →  6\n```","starter":"#include \u003cstdio.h>\n\nint gcd(int a, int b) {\n    // base case: b is 0\n    // otherwise: the answer is gcd(b, a % b)\n    return a;\n}\n\nint main(void) {\n    int a, b;\n    scanf(\"%d %d\", &a, &b);\n    printf(\"%d\\n\", gcd(a, b));\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint gcd(int a, int b) {\n    if (b == 0) {\n        return a;\n    }\n    return gcd(b, a % b);\n}\n\nint main(void) {\n    int a, b;\n    scanf(\"%d %d\", &a, &b);\n    printf(\"%d\\n\", gcd(a, b));\n    return 0;\n}\n","tests":[{"stdin":"48 18\n"},{"stdin":"17 5\n"},{"stdin":"100 75\n"},{"stdin":"9 0\n"},{"stdin":"270 192\n"}],"explain":"The second argument shrinks on every call, because `a % b` is always smaller than `b`. That guarantees the base case is reached."}]},{"id":"arrays","title":"Arrays","blurb":"Many boxes in a row, and what happens when you step past the last one.","lessons":[{"id":"arrays","title":"Boxes in a row","xp":25,"kind":"code","rules":{},"hints":["Remember the index of the best element rather than its value; a[best] gives you the value whenever you need it.","for (int i = 1; i \u003c n; i++) { if (a[i] > a[best]) best = i; }"],"remember":["The first element is `a[0]`; the last is `a[size - 1]`","`for (int i = 0; i \u003c n; i++)` visits every element of an n-element array"],"intro":"An **array** is a row of boxes of the same type, sitting side by side in memory. `int a[5];` makes five ints called `a[0]`, `a[1]`, `a[2]`, `a[3]` and `a[4]`.\n\nIndexes start at **0**, so the last valid index is one less than the size. The index can be any integer expression, which is what makes arrays and loops such a natural pair:\n\n```c\nint a[5] = {4, 8, 15, 16, 23};\nfor (int i = 0; i \u003c 5; i++) {\n    printf(\"%d\\n\", a[i]);\n}\n```\n\nAn initialiser list in braces fills the boxes in order. If the list is shorter than the array, the remaining boxes are set to 0. An array with no initialiser at all starts out uninitialised, like any other local.","ref":{"sec":"C17 §6.5.2.1 Array subscripting","text":"E1[E2] is defined to be identical to *((E1)+(E2)): the element E2 positions after the start of E1. For an array of N elements the valid subscripts are 0 to N-1."},"world":"An array is the machine's native data structure: one contiguous block, where the address of any element is found with one multiplication and one addition. Images, audio buffers, matrices and strings are all arrays underneath.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    int a[4] = {5, 6};\n    printf(\"%d %d\", a[1], a[3]);\n    return 0;\n}\n","options":["5 6","6 0","6 6","5 0"],"answer":1,"why":"a[0] is 5 and a[1] is 6. The list ran out after two values, so a[2] and a[3] were filled with 0."},"task":"The first number of the input is a count n (at most 100), followed by n whole numbers. Print the largest value and the index where it first appears:\n```\n5\n3 1 9 4 9   →  max 9 at index 2\n```","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    int n;\n    int a[100];\n    scanf(\"%d\", &n);\n    for (int i = 0; i \u003c n; i++) {\n        scanf(\"%d\", &a[i]);\n    }\n\n    int best = 0;   // index of the largest value seen so far\n    // look at a[1], a[2], ... and update best\n\n    printf(\"max %d at index %d\\n\", a[best], best);\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    int n;\n    int a[100];\n    scanf(\"%d\", &n);\n    for (int i = 0; i \u003c n; i++) {\n        scanf(\"%d\", &a[i]);\n    }\n\n    int best = 0;\n    for (int i = 1; i \u003c n; i++) {\n        if (a[i] > a[best]) {\n            best = i;\n        }\n    }\n\n    printf(\"max %d at index %d\\n\", a[best], best);\n    return 0;\n}\n","tests":[{"stdin":"5\n3 1 9 4 9\n"},{"stdin":"1\n-7\n"},{"stdin":"4\n-3 -1 -2 -8\n"},{"stdin":"6\n1 2 3 4 5 6\n"}],"explain":"Using `>` rather than `>=` keeps the **first** occurrence of the maximum: a later, equal value does not replace it."},{"id":"bounds","title":"Bug clinic: one step too far","xp":25,"kind":"fix","rules":{},"hints":["The report names an index. Which pass of the loop produces that index, and why does the loop allow it?","The condition i \u003c= 5 lets i reach 5. Change it to i \u003c 5."],"remember":["An array of n elements has no element n","Loop with `i \u003c n`, not `i \u003c= n`"],"intro":"C does not check array indexes. If you write `a[5]` for an array of five elements, the compiler produces code that reads the memory just past the end — whatever happens to live there.\n\nOn a real machine that may print a wrong number, corrupt a neighbouring variable, or crash, and it may behave differently on Tuesday. This is the single most common kind of bug in C programs.\n\n**This machine checks every access.** It stops at the exact statement that stepped outside and tells you which array and which index. Run the program below, read the report, and look at the memory panel to see where the loop had got to.","ref":{"sec":"C17 §6.5.6 Additive operators ¶8","text":"If the result of indexing points outside the array object (other than just past its last element), or if a pointer just past the end is dereferenced, the behaviour is undefined — Annex J.2 lists it among the undefined behaviours."},"world":"Out-of-bounds reads and writes are the bugs behind Heartbleed (2014) and a large share of all security vulnerabilities ever reported. Microsoft and Google have both said that roughly 70% of their serious security bugs are memory-safety errors like this one.","quiz":{"q":"An array is declared as int a[10]. Which indexes are valid?","code":null,"options":["1 to 10","0 to 9","0 to 10","1 to 9"],"answer":1,"why":"Ten elements, numbered from zero: 0, 1, 2, ... 9. a[10] would be an eleventh element that does not exist."},"task":"This program should print the total and the average of five scores:\n```\ntotal = 405\naverage = 81\n```\nIt has a bug. Run it, read what the machine reports, and fix it.","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    int scores[5] = {90, 72, 85, 60, 98};\n    int total = 0;\n\n    for (int i = 0; i \u003c= 5; i++) {\n        total += scores[i];\n    }\n\n    printf(\"total = %d\\n\", total);\n    printf(\"average = %d\\n\", total / 5);\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    int scores[5] = {90, 72, 85, 60, 98};\n    int total = 0;\n\n    for (int i = 0; i \u003c 5; i++) {\n        total += scores[i];\n    }\n\n    printf(\"total = %d\\n\", total);\n    printf(\"average = %d\\n\", total / 5);\n    return 0;\n}\n","tests":[{"stdin":""}],"explain":"`\u003c=` where `\u003c` was meant is called an off-by-one error. The loop ran six times over five elements; the sixth pass read memory that was never part of `scores`."},{"id":"arrayfn","title":"Arrays and functions","xp":30,"kind":"code","rules":{"defines":["reverse"]},"hints":["Swapping two boxes needs a third, temporary one: tmp = a[i]; a[i] = a[j]; a[j] = tmp;","The partner of index i is n - 1 - i. Loop i from 0 while i \u003c n / 2 — going all the way to n would swap everything back."],"remember":["An array argument is not copied: the function sees the original","Always pass the length along with the array"],"intro":"Arrays are the exception to \"arguments are copied\". When you pass an array to a function, what is passed is the **address of its first element** — the array itself is not copied.\n\nTwo consequences:\n\n- The function works on the caller's actual array, so changes it makes are visible afterwards.\n- The function cannot tell how long the array is. You have to pass the length as a separate argument.\n\n```c\nvoid fill(int a[], int n, int value) {\n    for (int i = 0; i \u003c n; i++) a[i] = value;\n}\n```\n\nStep into such a call and look at the parameter `a` in the stack panel: it is drawn as an arrow pointing back at the caller's array.","ref":{"sec":"C17 §6.7.6.3 Function declarators ¶7","text":"A parameter declared as \"array of type\" is adjusted to \"pointer to type\". In a call, the array argument is converted to a pointer to its first element (§6.3.2.1 ¶3)."},"world":"This is why so many C library functions take a pointer and a length side by side — fgets(buf, size, ...), memcpy(dst, src, n), qsort(base, count, ...). Forgetting the length, or passing the wrong one, is where buffer overflows come from.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nvoid zero(int a[]) {\n    a[0] = 0;\n}\nint main(void) {\n    int v[2] = {7, 8};\n    zero(v);\n    printf(\"%d %d\", v[0], v[1]);\n    return 0;\n}\n","options":["7 8","0 8","0 0","8 7"],"answer":1,"why":"Unlike an int argument, the array is not copied. zero works directly on main's v, so v[0] really becomes 0."},"task":"Write `reverse` so that it reverses the first n elements of the array **in place** — without using a second array.\n```\n5\n1 2 3 4 5   →  5 4 3 2 1\n```","starter":"#include \u003cstdio.h>\n\nvoid reverse(int a[], int n) {\n    // swap a[0] with a[n-1], a[1] with a[n-2], ... and stop in the middle\n}\n\nint main(void) {\n    int n;\n    int a[100];\n    scanf(\"%d\", &n);\n    for (int i = 0; i \u003c n; i++) scanf(\"%d\", &a[i]);\n\n    reverse(a, n);\n\n    for (int i = 0; i \u003c n; i++) printf(\"%d \", a[i]);\n    printf(\"\\n\");\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nvoid reverse(int a[], int n) {\n    for (int i = 0; i \u003c n / 2; i++) {\n        int tmp = a[i];\n        a[i] = a[n - 1 - i];\n        a[n - 1 - i] = tmp;\n    }\n}\n\nint main(void) {\n    int n;\n    int a[100];\n    scanf(\"%d\", &n);\n    for (int i = 0; i \u003c n; i++) scanf(\"%d\", &a[i]);\n\n    reverse(a, n);\n\n    for (int i = 0; i \u003c n; i++) printf(\"%d \", a[i]);\n    printf(\"\\n\");\n    return 0;\n}\n","tests":[{"stdin":"5\n1 2 3 4 5\n"},{"stdin":"1\n42\n"},{"stdin":"4\n1 2 3 4\n"},{"stdin":"2\n7 9\n"},{"stdin":"7\n-1 0 5 5 0 -1 9\n"}],"explain":"The loop stops at the middle. With an odd length the middle element is its own partner and needs no swap, which integer division `n / 2` handles for free."}]},{"id":"strings","title":"Strings","blurb":"Text is an array of small numbers with a zero at the end.","lessons":[{"id":"strings","title":"Text is an array","xp":30,"kind":"code","rules":{"defines":["my_strlen"],"noCalls":["strlen"]},"hints":["n can be both the counter and the index: keep increasing it while s[n] is not '\\0'.","while (s[n] != '\\0') { n++; }"],"remember":["A string of n characters occupies n + 1 chars","Loop over a string with `for (int i = 0; s[i] != '\\0'; i++)`"],"intro":"C has no string type. A string is an **array of char** whose last element is the character with value 0, written `'\\0'`. That terminator is the only way anyone knows where the text ends.\n\n```c\nchar word[] = \"cat\";    // four chars: 'c' 'a' 't' '\\0'\n```\n\nEach char is really a small integer — the character's code. `'a'` is 97, `'A'` is 65, `'0'` is 48.\n\n`%s` in printf prints chars starting at the given address until it meets the `'\\0'`. `scanf(\"%s\", word)` reads one word into the array and adds the terminator. There is no & here: an array's name already stands for its address.\n\nStep through the program and look at `word` in the memory panel — you can see each character in its own box, and the `\\0` at the end.","ref":{"sec":"C17 §7.1.1 Definitions of terms","text":"A string is a contiguous sequence of characters terminated by and including the first null character. The length of a string is the number of bytes preceding the null character."},"world":"Because the length is not stored, finding it means walking the whole string: strlen is a loop, not a lookup. Calling it inside another loop over the same string is a well-known way to make a fast program accidentally slow.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    char s[] = \"cat\";\n    printf(\"%lu\", sizeof s);\n    return 0;\n}\n","options":["3","4","8","1"],"answer":1,"why":"The compiler sized the array to fit the three letters plus the '\\0' terminator: four chars, one byte each."},"task":"Write `my_strlen`, which returns the number of characters in a string, not counting the terminator. Do it with a loop — do not call the library's `strlen`.\n```\nhello  →  hello -> 5\n```","starter":"#include \u003cstdio.h>\n\nint my_strlen(const char s[]) {\n    int n = 0;\n    // count characters until you reach '\\0'\n\n    return n;\n}\n\nint main(void) {\n    char word[64];\n    scanf(\"%s\", word);\n    printf(\"%s -> %d\\n\", word, my_strlen(word));\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint my_strlen(const char s[]) {\n    int n = 0;\n    while (s[n] != '\\0') {\n        n++;\n    }\n    return n;\n}\n\nint main(void) {\n    char word[64];\n    scanf(\"%s\", word);\n    printf(\"%s -> %d\\n\", word, my_strlen(word));\n    return 0;\n}\n","tests":[{"stdin":"hello\n"},{"stdin":"a\n"},{"stdin":"supercalifragilistic\n"},{"stdin":"C99\n"}],"explain":"You have just written one of the most-called functions in computing. The real `strlen` does the same walk, only with clever tricks to check several bytes at a time."},{"id":"shout","title":"Characters are numbers","xp":30,"kind":"code","rules":{"defines":["shout"],"noCalls":["toupper"]},"hints":["Loop until the terminator, as in the previous lesson. Inside, test s[i] >= 'a' && s[i] \u003c= 'z'.","s[i] = s[i] - 'a' + 'A';"],"remember":["`c - 'a'` is a letter's position in the alphabet","`'7' - '0'` turns a digit character into the number 7"],"intro":"Since a char is a small integer, you can do arithmetic with it. The letters are numbered consecutively: `'a'` to `'z'` are 97 to 122, and `'A'` to `'Z'` are 65 to 90.\n\nSo `c >= 'a' && c \u003c= 'z'` tests whether c is a lowercase letter, and `c - 'a' + 'A'` converts it to uppercase: subtracting `'a'` gives its position in the alphabet (0 to 25), and adding `'A'` moves that position into the capitals.\n\nDigits work the same way: `'7' - '0'` is the number 7.\n\nA function that receives a string can change it in place, exactly as with any other array.","ref":{"sec":"C17 §5.2.1 Character sets ¶3","text":"In both the source and execution character sets, the value of each decimal digit after 0 is one greater than the value of the previous digit. (Letters being contiguous is a property of ASCII, which every machine you are likely to meet uses.)"},"world":"The library versions of these tests are isalpha, isdigit, toupper and friends in \u003cctype.h>. Parsers, tokenisers and text protocols such as HTTP are built from character arithmetic like this.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    char c = 'a' + 3;\n    printf(\"%c %d\", c, '9' - '0');\n    return 0;\n}\n","options":["a3 9","d 9","d 57","100 9"],"answer":1,"why":"'a' + 3 is three letters after a, which is d. '9' - '0' is the distance between those two digit characters: 9."},"task":"Write `shout`, which converts every lowercase letter of a string to uppercase, in place. Leave all other characters alone, and do not call `toupper`.\n```\nMiXeD42  →  MIXED42\n```","starter":"#include \u003cstdio.h>\n\nvoid shout(char s[]) {\n    // for every character: if it is between 'a' and 'z', replace it with its capital\n}\n\nint main(void) {\n    char word[64];\n    scanf(\"%s\", word);\n    shout(word);\n    printf(\"%s\\n\", word);\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nvoid shout(char s[]) {\n    for (int i = 0; s[i] != '\\0'; i++) {\n        if (s[i] >= 'a' && s[i] \u003c= 'z') {\n            s[i] = s[i] - 'a' + 'A';\n        }\n    }\n}\n\nint main(void) {\n    char word[64];\n    scanf(\"%s\", word);\n    shout(word);\n    printf(\"%s\\n\", word);\n    return 0;\n}\n","tests":[{"stdin":"hello\n"},{"stdin":"MiXeD42\n"},{"stdin":"c\n"},{"stdin":"ALREADY\n"},{"stdin":"snake_case-and.dots\n"}],"explain":"The distance between a lowercase letter and its capital is always the same (32 in ASCII), so `- 'a' + 'A'` works for all 26 without a table."},{"id":"overflow","title":"Bug clinic: the buffer is too small","xp":30,"kind":"fix","rules":{},"hints":["Count what has to fit in full: five letters, a space, six letters, and the terminator.","5 + 1 + 6 + 1 = 13. Declare char full[13]; (or anything larger)."],"remember":["A buffer for n characters needs n + 1 bytes","strcpy and strcat trust you completely about the destination's size"],"intro":"`strcpy(dest, src)` copies a string, terminator included, into `dest`. `strcat(dest, src)` appends `src` to the end of the string already in `dest`. Both come from `\u003cstring.h>`.\n\nNeither knows how big `dest` is. They copy until they meet the `'\\0'` in the source, and if the destination array is too small they carry on writing into whatever lies beyond it. This is a **buffer overflow**.\n\nWhen you size a buffer, count every character, every space, and one more for the terminator.","ref":{"sec":"C17 §7.24.2.3 The strcpy function","text":"strcpy copies the string pointed to by the source, including the terminating null character, into the destination array. The standard gives it no way to know the destination's size; writing beyond the array is undefined behaviour."},"world":"The Morris worm of 1988, the first worm to spread across the internet, got in through a buffer overflow of this kind. Modern code uses length-aware calls such as snprintf(buf, sizeof buf, ...) instead.","quiz":{"q":"How many bytes does the string \"Hopper\" occupy in memory?","code":null,"options":["5","6","7","8"],"answer":2,"why":"Six letters plus the '\\0' terminator."},"task":"This program should join a first and last name and print:\n```\nGrace Hopper\n12 characters\n```\nRun it, read the report, and fix the bug.","starter":"#include \u003cstdio.h>\n#include \u003cstring.h>\n\nint main(void) {\n    char first[6] = \"Grace\";\n    char last[7] = \"Hopper\";\n    char full[10];\n\n    strcpy(full, first);\n    strcat(full, \" \");\n    strcat(full, last);\n\n    printf(\"%s\\n\", full);\n    printf(\"%lu characters\\n\", strlen(full));\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n#include \u003cstring.h>\n\nint main(void) {\n    char first[6] = \"Grace\";\n    char last[7] = \"Hopper\";\n    char full[13];\n\n    strcpy(full, first);\n    strcat(full, \" \");\n    strcat(full, last);\n\n    printf(\"%s\\n\", full);\n    printf(\"%lu characters\\n\", strlen(full));\n    return 0;\n}\n","tests":[{"stdin":""}],"explain":"The copy of \"Grace\" and the space fitted. The overflow happened part-way through appending \"Hopper\" — the machine stopped at the first byte written past the end of `full`."}]},{"id":"pointers","title":"Pointers","blurb":"Addresses as values: the idea that makes C, C.","lessons":[{"id":"address","title":"Where things live","xp":30,"kind":"code","rules":{"needs":[{"re":"\\*\\s*p\\s*(\\*=|=[^=])","msg":"change x through the pointer, with an assignment to *p"}],"forbids":[{"re":"(^|[^&\\w])x\\s*(\\*=|\\+=|=[^=])","msg":"do not assign to x directly — go through p"}]},"hints":["p = &x; stores the address of x in p. No star on the left: you are changing the pointer itself.","*p = *p * 3;  — the *p on the right reads x, the *p on the left writes x."],"remember":["`&x` — the address of x","`*p` — the box that p points to"],"intro":"Every variable lives somewhere in memory, and that somewhere has a number: its **address**. `&x` gives you the address of x.\n\nA **pointer** is a variable that holds an address. `int *p` declares p as \"pointer to int\":\n\n```c\nint x = 5;\nint *p = &x;    // p holds the address of x\n*p = 9;         // follow the address and store 9 there: x is now 9\n```\n\n`*p` means \"the thing p points to\". Reading `*p` reads x; assigning to `*p` changes x. This is called **dereferencing** the pointer.\n\nPress **Step** and watch the memory panel: p is drawn as an arrow from p's box to x's box. The pointer and the thing it points to are two separate boxes — p itself contains only an address.","ref":{"sec":"C17 §6.5.3.2 Address and indirection operators","text":"The unary & operator yields the address of its operand, with type \"pointer to type\". The unary * operator denotes indirection: if the operand points to an object, the result is an lvalue designating that object."},"world":"Addresses are how the machine itself works: the CPU has no notion of variable names, only of memory locations. Pointers are C letting you say what the hardware actually does, which is why operating systems, drivers and language runtimes are written in it.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    int a = 1, b = 2;\n    int *p = &a;\n    *p = 10;\n    p = &b;\n    *p = 20;\n    printf(\"%d %d\", a, b);\n    return 0;\n}\n","options":["1 2","10 2","10 20","20 20"],"answer":2,"why":"First p points at a, so *p = 10 changes a. Then p itself is changed to point at b (no star: the arrow moves), and *p = 20 changes b."},"task":"`p` should point at `x`. Using only `p` — never the name `x` on the left of an assignment — triple the value of x.\n```\n4  →  x = 12\n```","starter":"#include \u003cstdio.h>\n\nint main(void) {\n    int x;\n    scanf(\"%d\", &x);\n\n    int *p = NULL;\n    // 1. make p point at x\n    // 2. through p, replace x with three times its value\n\n    printf(\"x = %d\\n\", x);\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nint main(void) {\n    int x;\n    scanf(\"%d\", &x);\n\n    int *p = NULL;\n    p = &x;\n    *p = *p * 3;\n\n    printf(\"x = %d\\n\", x);\n    return 0;\n}\n","tests":[{"stdin":"4\n"},{"stdin":"0\n"},{"stdin":"-7\n"},{"stdin":"100\n"}],"explain":"`p = ...` moves the arrow. `*p = ...` follows the arrow and changes what is at the other end. Keeping those two apart is most of what there is to learn about pointers."},{"id":"swap","title":"Letting a function change your variables","xp":30,"kind":"code","rules":{"defines":["swap"]},"hints":["Make the parameters pointers: void swap(int *a, int *b). Then the caller must pass addresses: swap(&x, &y).","Inside: int t = *a; *a = *b; *b = t;  — t stays a plain int, because it holds a value, not an address."],"remember":["To let a function change a variable, pass `&variable` and declare the parameter as a pointer","Inside the function, use `*param` to reach the caller's box"],"intro":"A function receives copies of its arguments, so it cannot change the caller's variables — unless the caller passes their **addresses**.\n\n```c\nvoid set_to_zero(int *p) {\n    *p = 0;\n}\n\nint n = 5;\nset_to_zero(&n);    // n is now 0\n```\n\nThe function still receives a copy, but it is a copy of an address, and an address is all it needs to reach the original box.\n\nYou have been doing this since the third lesson: `scanf(\"%d\", &n)`.\n\nThe starter program below shows the classic mistake. Step through it and watch: `swap` swaps its own copies perfectly, then its frame disappears and main's variables are exactly as they were.","ref":{"sec":"C17 §6.5.2.2 Function calls ¶4","text":"An argument may be an expression of any complete object type. A function can change its parameters but not the caller's arguments; however, when a pointer to an object is passed, the function may change the value of the object pointed to."},"world":"\"Out-parameters\" are how C functions return more than one thing: scanf returns how many items it read and also fills in your variables; strtol returns the number and also tells you where parsing stopped.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nvoid swap(int a, int b) {\n    int t = a;\n    a = b;\n    b = t;\n}\nint main(void) {\n    int x = 1, y = 2;\n    swap(x, y);\n    printf(\"%d %d\", x, y);\n    return 0;\n}\n","options":["1 2","2 1","1 1","2 2"],"answer":0,"why":"swap exchanges its own parameters a and b, which are copies. main's x and y are never touched."},"task":"Fix `swap` so that it really exchanges the caller's two variables. You will need to change its parameters, its body, and the way main calls it.\n```\n1 2  →  2 1\n```","starter":"#include \u003cstdio.h>\n\nvoid swap(int a, int b) {\n    int t = a;\n    a = b;\n    b = t;\n}\n\nint main(void) {\n    int x, y;\n    scanf(\"%d %d\", &x, &y);\n\n    swap(x, y);\n\n    printf(\"%d %d\\n\", x, y);\n    return 0;\n}\n","solution":"#include \u003cstdio.h>\n\nvoid swap(int *a, int *b) {\n    int t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint main(void) {\n    int x, y;\n    scanf(\"%d %d\", &x, &y);\n\n    swap(&x, &y);\n\n    printf(\"%d %d\\n\", x, y);\n    return 0;\n}\n","tests":[{"stdin":"1 2\n"},{"stdin":"5 5\n"},{"stdin":"-3 8\n"},{"stdin":"1000000 -1000000\n"}],"explain":"The body has the same three steps as before. The only difference is the stars: each one says \"the caller's box\", where before it was \"my copy\"."},{"id":"ptrmath","title":"Pointers and arrays are neighbours","xp":35,"kind":"code","rules":{"defines":["sum"],"noIndexIn":"sum"},"hints":["Start a pointer at begin. While it is not equal to end, add *p to total and advance with p++.","for (const int *p = begin; p != end; p++) { total += *p; }"],"remember":["`a[i]` and `*(a + i)` are the same thing","`p + 1` moves by one element, whatever its size"],"intro":"Adding 1 to a pointer moves it to the **next element**, not the next byte: for an `int *`, `p + 1` is 4 bytes further on. That is why pointers have types.\n\nAn array's name, used in an expression, turns into a pointer to its first element. So for `int a[5]`:\n\n- `a` is the same address as `&a[0]`\n- `*(a + i)` is exactly what `a[i]` means\n- `p++` steps a pointer along the array\n\n```c\nfor (int *p = a; p \u003c a + 5; p++) {\n    printf(\"%d\\n\", *p);\n}\n```\n\n`a + 5` points just past the last element. Holding that address is allowed, and comparing against it is the usual way to end a loop — but it must never be dereferenced.\n\nSubtracting two pointers into the same array gives the number of elements between them.","ref":{"sec":"C17 §6.5.6 Additive operators ¶8","text":"When an integer is added to a pointer into an array, the result points to an element offset by that many elements. A pointer one past the last element is valid for arithmetic and comparison, but shall not be used as the operand of a unary * operator."},"world":"A pair of pointers, begin and one-past-the-end, is the standard way to describe a range in C and C++ — it is the model behind every C++ iterator and behind slices in newer languages.","quiz":{"q":"What does this program print?","code":"#include \u003cstdio.h>\nint main(void) {\n    int a[] = {10, 20, 30, 40};\n    int *p = a + 1;\n    printf(\"%d %d\", *(p + 2), p[-1]);\n    return 0;\n}\n","options":["30 20","30 10","40
