<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PixelPath – Learn Pixel Art for Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#d7def0;--card:#f7f8fd;--ink:#1d1b3a;--mute:#55527a;--line:#b7bedb;--acc:#ff4f8b;--blue:#2f5bff;--ok:#1f9d55;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#1f1c40;--ink:#f0eeff;--mute:#a7a3d6;--line:#3a3670;--acc:#ff7aa8;--blue:#8ea3ff;--ok:#4fd98b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14122b;--card:#1f1c40;--ink:#f0eeff;--mute:#a7a3d6;--line:#3a3670;--acc:#ff7aa8;--blue:#8ea3ff;--ok:#4fd98b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1,h2{font-family:"Press Start 2P",ui-monospace,Menlo,monospace;margin:0}
h1{font-size:14px;line-height:1.4}
h2{font-size:11px;line-height:1.7;margin-bottom:10px}
.sub{color:var(--mute);font-size:13px;margin:4px 0 0}
.prog{min-width:210px;font-size:13px;color:var(--mute)}
.bar{height:10px;border:2px solid var(--ink);margin-top:5px;background:var(--card)}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:8px}
.chip{flex:0 0 auto;border:2px solid var(--ink);background:var(--card);padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.d::after{content:" ✓";color:var(--ok);font-weight:700}
.chip.on.d::after{color:inherit}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:16px}
p{margin:0 0 10px}
.lvl{color:var(--mute);font-size:13px;margin:0 0 6px}
.tip{border-left:4px solid var(--blue);padding:6px 10px;font-size:13px;color:var(--mute)}
h3{font-size:14px;margin:14px 0 4px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px}
li::before{content:"";flex:0 0 20px;height:20px;border:2px solid var(--ink);margin-top:1px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
li.ok::before{content:"✓";background:var(--ok)}
.win{margin-top:12px;padding:12px;border:2px solid var(--ink);background:var(--ok);color:#04200e}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tools,.pal{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.btn{border:2px solid var(--ink);background:var(--card);padding:6px 12px;cursor:pointer;font-size:13px}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sw{width:38px;height:38px;border:2px solid var(--ink);cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:3px solid var(--acc);outline-offset:2px}
#c{display:block;width:100%;max-width:480px;aspect-ratio:1;margin:0 auto;box-shadow:0 0 0 3px var(--ink);image-rendering:pixelated;touch-action:none;cursor:crosshair}
.pvbox{display:flex;gap:14px;align-items:center;margin-top:18px;flex-wrap:wrap}
#pv{image-rendering:pixelated;box-shadow:0 0 0 2px var(--ink)}
.cap{font-size:13px;color:var(--mute);max-width:260px;margin:0}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>PixelPath</h1><p class="sub">Learn pixel art for games, one objective at a time.</p></div>
<div class="prog"><span id="pt"></span><div class="bar"><i id="pb"></i></div></div>
</header>
<nav id="chips" aria-label="Lessons"></nav>
<div class="grid">
<section class="card">
<p class="lvl" id="lv"></p><h2 id="lt"></h2>
<p id="ll"></p><p class="tip" id="lp"></p>
<h3>Objectives</h3><ul id="ob"></ul>
<div class="win" id="win" hidden aria-live="polite"><b>All objectives complete. Nice work!</b><br><button class="btn" id="nx" style="margin-top:8px"></button></div>
</section>
<section class="card">
<div class="tools" id="tl">
<button class="btn" data-t="pen">Pencil</button>
<button class="btn" data-t="erase">Eraser</button>
<button class="btn" data-t="fill">Fill</button>
<button class="btn" id="mi">Mirror</button>
<button class="btn" id="un">Undo</button>
<button class="btn" id="cl">Clear</button>
</div>
<div class="pal" id="pl"></div>
<canvas id="c" width="480" height="480" role="img" aria-label="Pixel canvas"></canvas>
<div class="pvbox"><canvas id="pv"></canvas><p class="cap" id="pc"></p></div>
</section>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
let erased=false;
function inner(g,n){const seen=new Uint8Array(n*n),q=[];
const go=(x,y)=>{if(x<0||y<0||x>=n||y>=n)return;const i=y*n+x;if(seen[i]||g[i]===0)return;seen[i]=1;q.push(i)};
for(let i=0;i<n;i++){go(i,0);go(i,n-1);go(0,i);go(n-1,i)}
while(q.length){const i=q.pop(),x=i%n,y=i/n|0;go(x+1,y);go(x-1,y);go(x,y+1);go(x,y-1)}
let t=0,e=0;g.forEach((v,i)=>{if(!seen[i]&&v!==0){t++;if(v<0)e++}});return[t,e]}
const sym=(g,n)=>{let a=0,m=0;for(let y=0;y<n;y++)for(let x=0;x<n/2;x++){const p=g[y*n+x],q=g[y*n+n-1-x];if(p<0&&q<0)continue;a++;if(p===q)m++}return a?m/a:0};
const cen=(g,n,k)=>{let s=0,c=0;g.forEach((v,i)=>{if(v===k){s+=i%n+(i/n|0);c++}});return c?s/c:null};
const bord=(g,n)=>{let a=0,b=0;g.forEach((v,i)=>{const x=i%n,y=i/n|0;if(x%(n-1)==0||y%(n-1)==0){b++;if(v===0)a++}});return a/b};
const det=(g,n)=>{let a=0;g.forEach((v,i)=>{const x=i%n,y=i/n|0;if(x>0&&y>0&&x<n-1&&y<n-1&&v>0)a++});return a};
const S=[
{id:1,t:'Meet the Pixel',n:8,pal:['#222034','#d95763','#fbf236','#5fcde4'],
learn:'Every sprite is a grid of tiny squares. With so few pixels, each one is a deliberate choice, and there’s no room for accidents.',
tip:'Pick a colour, then click or drag on the grid. The eraser removes pixels, and Undo is always there.',
obj:[['Place 10 pixels',s=>s.f>=10],['Use 2 different colours',s=>s.u>=2],['Erase a pixel with the eraser',()=>erased]]},
{id:2,t:'Outline & Fill',n:12,pal:['#222034','#d95763','#fbf236','#99e550'],
learn:'A dark outline separates a sprite from any background, so it stays readable on grass, sand or snow. Draw the outline first, then fill inside.',
tip:'Use the first swatch (the darkest) for the outline. If the Fill tool leaks out, your outline has a gap.',
obj:[['Draw a closed outline in the first colour, enclosing 12+ pixels',(s,g,n)=>inner(g,n)[0]>=12],['Fill every pixel inside the outline',(s,g,n)=>{const[t,e]=inner(g,n);return t>=12&&!e}],['Use a second colour for the fill',s=>s.f-s.c[0]>=12]]},
{id:3,t:'Limited Palette',n:16,pal:['#0f380f','#306230','#8bac0f','#9bbc0f'],
learn:'Fewer colours make art feel unified. The original Game Boy managed with four shades of green: darkest for outlines, lightest for highlights.',
tip:'Try an apple, a potion bottle or a gem. Decide which shade does which job before you start.',
obj:[['Use all 4 palette colours',s=>s.u===4],['Cover at least half the canvas',(s,g,n)=>s.f>=n*n/2],['Use the darkest shade for 20+ outline pixels',s=>s.c[0]>=20]]},
{id:4,t:'Light & Shade',n:16,pal:['#1b1b3a','#2f4f9d','#4f86e6','#a9d0ff'],
learn:'Choose one light source and stick to it. Highlights face the light and shadows sit on the far side. Three tones of one hue make a flat shape feel round.',
tip:'Draw a ball: base colour first, then a shadow crescent at the bottom-right and a highlight at the top-left.',
obj:[['Fill at least 60 pixels',s=>s.f>=60],['Use shadow, base and highlight tones',s=>s.c[1]&&s.c[2]&&s.c[3]],['Light from the top-left: highlights sit above-left of shadows',(s,g,n)=>{const h=cen(g,n,3),d=cen(g,n,1);return h!==null&&d!==null&&h<d-1}]]},
{id:5,t:'Symmetry',n:16,mir:1,pal:['#222034','#6abe30','#d95763','#fbf236','#ffffff'],
learn:'Most characters are symmetrical. Draw one half with Mirror on and you get the other half for free, then break the symmetry with a few details.',
tip:'Mirror is already on. Try a slime, a ghost or a little robot.',
obj:[['Fill at least 80 pixels',s=>s.f>=80],['Use 3 or more colours',s=>s.u>=3],['Be at least 95% symmetrical',(s,g,n)=>s.f>=40&&sym(g,n)>=.95]]},
{id:6,t:'Seamless Tiles',n:8,tile:1,pal:['#3a7d2c','#5aa63c','#8fd14f','#2a5a20'],
learn:'Game worlds repeat tiles hundreds of times. Keep busy details away from the edges so tiles join without visible seams, and check the 3×3 preview.',
tip:'Fill the whole tile with the first colour, then sprinkle a few lighter and darker details in the middle.',
obj:[['Fill the whole tile',(s,g,n)=>s.f===n*n],['Base colour on 80%+ of the border pixels',(s,g,n)=>bord(g,n)>=.8],['Add 6+ detail pixels inside',(s,g,n)=>det(g,n)>=6]]}
];
const K='pixelpath-v1';let P={done:{},work:{},cur:0};
try{Object.assign(P,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
P.done=P.done||{};P.work=P.work||{};
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(P))}catch(e){}};
let cur=Math.min(+P.cur||0,S.length-1),L,g,hist=[],tool='pen',col=0,mir=false;
const snap=()=>{hist.push(g.slice());if(hist.length>60)hist.shift()};
const save=()=>{P.work[L.id]=g.slice();sv()};
const undo=()=>{if(hist.length){g=hist.pop();draw();check();save()}};
function head(){const d=Object.keys(P.done).length;$('#pt').textContent=d+'/'+S.length+' lessons done, '+d*100+' XP';$('#pb').style.width=d/S.length*100+'%'}
function chips(){$('#chips').innerHTML=S.map((l,i)=>`<button class="chip${i===cur?' on':''}${P.done[l.id]?' d':''}" data-i="${i}">${l.id}. ${l.t}</button>`).join('')}
function ui(){
$('#pl').innerHTML=L.pal.map((c,i)=>`<button class="sw" data-i="${i}" style="background:${c}" aria-label="Colour ${i+1}" aria-pressed="${i===col}"></button>`).join('');
document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===tool));
$('#mi').setAttribute('aria-pressed',mir)}
function draw(){
const n=L.n,s=cv.width/n;
for(let j=0;j<n;j++)for(let i=0;i<n;i++){const v=g[j*n+i];ctx.fillStyle=v<0?((i+j)%2?'#c9cfdb':'#dfe3ec'):L.pal[v];ctx.fillRect(i*s,j*s,s,s)}
ctx.strokeStyle='rgba(0,0,0,.14)';ctx.lineWidth=1;ctx.beginPath();
for(let k=1;k<n;k++){ctx.moveTo(k*s,0);ctx.lineTo(k*s,cv.height);ctx.moveTo(0,k*s);ctx.lineTo(cv.width,k*s)}
ctx.stroke();pv()}
function pv(){
const n=L.n,k=L.tile?3:1,p=$('#pv'),q=p.getContext('2d'),sc=Math.round((L.tile?168:96)/(n*k));
p.width=p.height=n*k;p.style.width=p.style.height=n*k*sc+'px';
q.fillStyle='#8ecae6';q.fillRect(0,0,n*k,n*k);
for(let t=0;t<k*k;t++)g.forEach((v,i)=>{if(v>=0){q.fillStyle=L.pal[v];q.fillRect((t%k)*n+i%n,(t/k|0)*n+(i/n|0),1,1)}})}
function check(){
const n=L.n,c=L.pal.map(()=>0);let f=0;
g.forEach(v=>{if(v>=0){c[v]++;f++}});
const s={c,f,u:c.filter(Boolean).length},r=L.obj.map(o=>!!o[1](s,g,n));
$('#ob').innerHTML=L.obj.map((o,i)=>`<li class="${r[i]?'ok':''}">${o[0]}</li>`).join('');
const all=r.every(Boolean);$('#win').hidden=!all;
$('#nx').textContent=cur<S.length-1?'Next lesson':'Start over';
if(all&&!P.done[L.id]){P.done[L.id]=1;sv();head();chips()}}
function load(i){
cur=i;P.cur=i;L=S[i];const n=L.n,w=P.work[L.id];
g=Array.isArray(w)&&w.length===n*n?w.slice():Array(n*n).fill(-1);
hist=[];erased=false;col=0;tool='pen';mir=!!L.mir;
$('#lv').textContent='Lesson '+L.id+' of '+S.length;$('#lt').textContent=L.t;$('#ll').textContent=L.learn;$('#lp').textContent='Tip: '+L.tip;
$('#pc').textContent=L.tile?'Tiled 3×3 preview. Look for visible seams.':'In-game preview on a sky background.';
ui();chips();draw();check();sv()}
function flood(a,b){const n=L.n,t=g[b*n+a];if(t===col)return;const st=[[a,b]];
while(st.length){const[x,y]=st.pop();if(x<0||y<0||x>=n||y>=n||g[y*n+x]!==t)continue;g[y*n+x]=col;st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1])}}
function stroke(a,b,c,d,first){
const n=L.n,m=Math.max(Math.abs(c-a),Math.abs(d-b))||1;
for(let t=0;t<=m;t++){const x=Math.round(a+(c-a)*t/m),y=Math.round(b+(d-b)*t/m);
for(const px of mir?[x,n-1-x]:[x]){
if(tool==='fill'){if(first)flood(px,y)}
else{const i=y*n+px;if(tool==='erase'){if(g[i]>=0)erased=true;g[i]=-1}else g[i]=col}}}
draw();check()}
let dn=false,lx=0,ly=0;
const at=e=>{const r=cv.getBoundingClientRect(),n=L.n,f=(v,o,s)=>Math.max(0,Math.min(n-1,Math.floor((v-o)/s*n)));return[f(e.clientX,r.left,r.width),f(e.clientY,r.top,r.height)]};
cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);snap();dn=true;[lx,ly]=at(e);stroke(lx,ly,lx,ly,true)};
cv.onpointermove=e=>{if(!dn)return;const[x,y]=at(e);stroke(lx,ly,x,y,false);lx=x;ly=y};
cv.onpointerup=cv.onpointercancel=()=>{if(dn){dn=false;save()}};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b)load(+b.dataset.i)};
$('#pl').onclick=e=>{const b=e.target.closest('.sw');if(b){col=+b.dataset.i;if(tool==='erase')tool='pen';ui()}};
$('#tl').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.t)tool=b.dataset.t;
else if(b.id==='mi')mir=!mir;
else if(b.id==='un')undo();
else if(b.id==='cl'){snap();g.fill(-1);draw();check();save()}
ui()};
$('#nx').onclick=()=>load((cur+1)%S.length);
head();load(cur);
</script>
</body>
</html>
