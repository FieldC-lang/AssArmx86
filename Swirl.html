<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swirl – Van Gogh Style Pixel Scenes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{--bg:#dfe8f5;--card:#fffdf4;--ink:#0f1f4d;--mute:#4a5a86;--line:#b7c6e4;--acc:#e0a100;--ok:#2b7a3e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1433;--card:#122052;--ink:#f3ecc8;--mute:#a9b7e0;--line:#2a3d85;--acc:#ffd23f;--ok:#7bd88f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1433;--card:#122052;--ink:#f3ecc8;--mute:#a9b7e0;--line:#2a3d85;--acc:#ffd23f;--ok:#7bd88f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1,h2{font-family:DotGothic16,ui-monospace,Menlo,monospace;font-weight:400;margin:0}
h1{font-size:40px;line-height:1}
h2{font-size:24px;line-height:1.2;margin-bottom:8px}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}
.prog{min-width:210px;font-size:13px;color:var(--mute)}
.bar{height:10px;border:2px solid var(--ink);margin-top:5px;background:var(--card)}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:8px}
.chip{flex:0 0 auto;border:2px solid var(--ink);background:var(--card);padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.d::after{content:" ✓";color:var(--ok);font-weight:700}
.chip.on.d::after{color:inherit}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--acc);padding:16px}
p{margin:0 0 10px}
.lvl{color:var(--mute);font-size:13px;margin:0 0 2px}
.tip{border-left:4px solid var(--acc);padding:6px 10px;font-size:13px;color:var(--mute)}
h3{font-size:14px;margin:14px 0 4px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px}
li::before{content:"";flex:0 0 20px;height:20px;border:2px solid var(--ink);margin-top:1px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
li.ok::before{content:"✓";background:var(--ok)}
.win{margin-top:12px;padding:12px;border:2px solid var(--ink);background:var(--ok);color:#04200e}
.cap{font-size:13px;color:var(--mute);margin:10px 0 0}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.btn{border:2px solid var(--ink);background:var(--card);padding:5px 10px;cursor:pointer;font-size:13px}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#pl{display:grid;grid-template-columns:repeat(5,minmax(0,40px));gap:4px;margin-bottom:12px}
.sw{height:28px;border:2px solid var(--ink);cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:3px solid var(--acc);outline-offset:2px}
#c{display:block;width:100%;aspect-ratio:8/5;box-shadow:0 0 0 3px var(--ink);image-rendering:pixelated;touch-action:none;cursor:crosshair}
.gray{filter:grayscale(1)}
.pvbox{margin-top:16px}
#pv{display:block;width:256px;max-width:100%;height:auto;image-rendering:pixelated;box-shadow:0 0 0 2px var(--ink)}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>Swirl</h1><p class="sub">Paint pixel scenes in the style of Van Gogh, one technique at a time.</p></div>
<div class="prog"><span id="pt"></span><div class="bar"><i id="pb"></i></div></div>
</header>
<nav id="chips" aria-label="Lessons"></nav>
<div class="grid">
<section class="card">
<p class="lvl" id="lv"></p><h2 id="lt"></h2>
<p id="ll"></p><p class="tip" id="lp"></p>
<h3>Objectives</h3><ul id="ob"></ul>
<div class="win" id="win" hidden aria-live="polite"><b>Lesson complete. Nice work!</b><br><button class="btn" id="nx" style="margin-top:8px"></button></div>
<p class="cap">Your night scene carries over between lessons. The dashed yellow line marks the horizon.</p>
</section>
<section class="card">
<div class="row" id="tl">
<button class="btn" data-t="pen">Pencil</button>
<button class="btn" data-t="stroke">Stroke</button>
<button class="btn" data-t="rect">Rectangle</button>
<button class="btn" data-t="fill">Fill</button>
<button class="btn" data-t="pick">Pick</button>
<button class="btn" data-t="erase">Eraser</button>
<button class="btn" id="un">Undo</button>
<button class="btn" id="sq">Squint</button>
<button class="btn" id="ex">Example scene</button>
<button class="btn" id="cl">Clear all</button>
</div>
<div id="pl"></div>
<canvas id="c" width="576" height="360" role="img" aria-label="64 by 40 pixel scene canvas"></canvas>
<div class="pvbox"><canvas id="pv" width="64" height="40"></canvas><p class="cap">Preview at 4×. Squint at it: the sky should glow toward the horizon.</p></div>
</section>
</div>
</div>
<script>
const $=s=>document.querySelector(s),W=64,H=40,HZ=24;
const cv=$('#c'),ctx=cv.getContext('2d');
const R=[['#0a1640','#1b3a8c','#2f6fd0','#7db3ee','#d3ecff'],['#6b4a00','#c78a00','#f2c200','#ffe14d','#fff7b8'],['#0f3326','#2b5e3b','#5b8f48','#9dbb5c','#dbe08a'],['#4a2210','#9c4a18','#df7a22','#f5a845','#fcd592'],['#26124a','#4b2a86','#7c55c4','#ad90e4','#dccdf7']];
const C=v=>R[v/5|0][v%5],rm=v=>v/5|0,tn=v=>v%5;
let L,g,hist=[],tool='pen',col=2,sqd=false,dn=false,lx=0,lz=0,sx=0,sy=0,base=[],dir=[1,0],dc=0,sc=0;
const cnt=(f,y0=0,y1=H)=>{let n=0;for(let i=y0*W;i<y1*W;i++)if(g[i]>=0&&f(g[i]))n++;return n};
const pairs=(f,y0=0,y1=H)=>{let n=0;for(let i=y0*W;i<y1*W;i++){const v=g[i];if(v<0)continue;if(i%W<W-1&&g[i+1]>=0&&f(v,g[i+1]))n++;if(i+W<W*H&&g[i+W]>=0&&f(v,g[i+W]))n++}return n};
const avgT=(y0,y1)=>{let s=0,n=0;for(let i=y0*W;i<y1*W;i++){const v=g[i];if(v>=0&&rm(v)===0){s+=tn(v);n++}}return n?s/n:null};
function flow(y0,y1){let tiles=0;const ds=new Set();
for(let ty=y0;ty<y1;ty+=8)for(let tx=0;tx<W;tx+=8){const c=[0,0,0,0];
for(let y=ty;y<Math.min(ty+8,y1);y++)for(let x=tx;x<tx+8;x++){const i=y*W+x,v=g[i];if(v<0)continue;
if(x<W-1&&g[i+1]===v)c[0]++;if(y<H-1&&g[i+W]===v)c[1]++;if(x<W-1&&y<H-1&&g[i+W+1]===v)c[2]++;if(x>0&&y<H-1&&g[i+W-1]===v)c[3]++}
const s=c[0]+c[1]+c[2]+c[3],m=Math.max(...c);if(s>=24&&m>=.34*s){tiles++;ds.add(c.indexOf(m))}}
return[tiles,ds.size]}
function comps(p,y0,y1){const sn=new Uint8Array(W*H),o=[];
for(let s=y0*W;s<y1*W;s++){if(sn[s]||!p(s))continue;const q=[s],c=[];sn[s]=1;
while(q.length){const i=q.pop(),x=i%W;c.push(i);for(const j of[x<W-1?i+1:-1,x>0?i-1:-1,i+W,i-W])if(j>=y0*W&&j<y1*W&&!sn[j]&&p(j)){sn[j]=1;q.push(j)}}
o.push(c)}return o}
const yl=i=>g[i]>=0&&rm(g[i])===1&&tn(g[i])>=3;
const halo=c=>{const r=new Set(),cs=new Set(c);c.forEach(i=>{const x=i%W,y=i/W|0;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const X=x+a,Y=y+b;if(X>=0&&Y>=0&&X<W&&Y<H&&!cs.has(Y*W+X))r.add(Y*W+X)}});let n=0;r.forEach(i=>{if(g[i]>=0&&rm(g[i])===0&&tn(g[i])>=3)n++});return n};
const stars=()=>comps(yl,0,HZ).filter(c=>c.length>=2&&c.length<=30);
const cyp=()=>comps(i=>g[i]>=0&&rm(g[i])===2&&tn(g[i])<=1,0,H).some(c=>{const ys=c.map(i=>i/W|0),xs=c.map(i=>i%W);return c.length>=30&&Math.max(...ys)-Math.min(...ys)>=13&&Math.max(...xs)-Math.min(...xs)<=11});
const S=[
{id:1,t:'Block in the scene',
learn:'Van Gogh built every picture on a bold, simple value structure before any texture. In a night scene the sky is dark at the top and glows toward the horizon, and the ground sits below as one calmer mass.',
tip:'Use Rectangle to block in the sky with cobalt tones, darker at the top, then the ground below the horizon. Colour counts here, not detail.',
obj:[['Paint the sky: 90%+ of it in cobalt blues',()=>cnt(v=>rm(v)===0,0,HZ)>=.9*W*HZ],['Paint the ground: 90%+ of the rows below the horizon',()=>cnt(()=>true,HZ,H)>=.9*W*(H-HZ)],['Darker sky at the top, lighter near the horizon',()=>{const a=avgT(0,8),b=avgT(16,24);return a!==null&&b!==null&&b-a>=.3}]]},
{id:2,t:'Brushstrokes',
learn:'His paint was thick and visible. In pixels that becomes short directional dashes instead of smooth fills. The Stroke tool paints a 3-pixel dash along your drag direction, and every third dab shifts one tone, so the colour looks broken like real paint.',
tip:'Drag the Stroke tool over your blocked-in areas in many short passes. Follow the shape of whatever you are painting.',
obj:[['Paint with strokes: 12+ areas show a clear direction',()=>flow(0,H)[0]>=12],['Break your colour: 150+ touching pixels one tone apart',()=>pairs((a,b)=>rm(a)===rm(b)&&Math.abs(tn(a)-tn(b))===1)>=150],['Use 10+ different colours',()=>new Set(g.filter(v=>v>=0)).size>=10]]},
{id:3,t:'Swirls and flow',
learn:'The swirling sky is the signature move: strokes that curve and change direction, so the whole sky seems to move. Inside one patch the strokes agree, and neighbouring patches turn a little.',
tip:'Drag in arcs and spirals across the sky, then add the lighter blues along the turns where the light would catch.',
obj:[['Sky strokes: 8+ areas with a clear direction',()=>flow(0,HZ)[0]>=8],['Let the strokes turn: 3+ different directions in the sky',()=>flow(0,HZ)[1]>=3],['Add swirl light: 60+ pixels of the two lightest blues in the sky',()=>cnt(v=>rm(v)===0&&tn(v)>=3,0,HZ)>=60]]},
{id:4,t:'Glowing stars',
learn:'Stars become bursts of light: a small bright yellow core wrapped in rings of lighter blue, set against the darkest part of the sky.',
tip:'Use the Pencil for a 2 to 5 pixel yellow core, then ring it with the two lightest blues.',
obj:[['Add 3+ stars: bright yellow clusters of 2 to 30 pixels in the sky',()=>stars().length>=3],['Give 3+ stars a halo: 3+ light-blue pixels touching each',()=>stars().filter(c=>halo(c)>=3).length>=3],['Keep the sky dark around them: 80+ dark-blue pixels',()=>cnt(v=>rm(v)===0&&tn(v)<=1,0,HZ)>=80]]},
{id:5,t:'Complementary contrast',
learn:'Van Gogh made colours vibrate by placing opposites together: blue beside orange, yellow beside violet. Warm windows against a cool night are the classic pairing.',
tip:'Add orange strokes along the horizon, violet shadows in the village, and small yellow windows.',
obj:[['Blue meets orange: 40+ touching pixel pairs',()=>pairs((a,b)=>(rm(a)===0&&rm(b)===3)||(rm(a)===3&&rm(b)===0))>=40],['Yellow meets violet: 20+ touching pairs',()=>pairs((a,b)=>(rm(a)===1&&rm(b)===4)||(rm(a)===4&&rm(b)===1))>=20],['Light 4+ windows: small bright-yellow clusters below the horizon',()=>comps(yl,HZ,H).filter(c=>c.length>=2&&c.length<=20).length>=4]]},
{id:6,t:'Cypress and contours',
learn:'The dark cypress rises like a flame, painted with tall curling strokes. Add dark cobalt contours around the main shapes, the way he outlined forms in thick blue, then squint to check your values.',
tip:'Build the cypress from tones 1 and 2 of the green ramp. Trace edges with the darkest blue where shapes meet.',
obj:[['Add a cypress: a dark green flame shape 14+ pixels tall',cyp],['Draw dark cobalt contours below the horizon: 40+ touching pairs',()=>pairs((a,b)=>a!==b&&(a===0||b===0),HZ,H)>=40],['Check your values with Squint',()=>sqd]]}
];
const K='swirl-v1';let P={done:{},art:null,cur:0};
try{Object.assign(P,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
P.done=P.done||{};
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(P))}catch(e){}};
let cur=Math.min(+P.cur||0,S.length-1);
g=Array.isArray(P.art)&&P.art.length===W*H?P.art.slice():Array(W*H).fill(-1);
const snap=()=>{hist.push(g.slice());if(hist.length>40)hist.shift()};
const save=()=>{P.art=g.slice();sv()};
const undo=()=>{if(hist.length){g=hist.pop();draw();check();save()}};
function head(){const d=Object.keys(P.done).length;$('#pt').textContent=d+'/'+S.length+' lessons done, '+d*100+' XP';$('#pb').style.width=d/S.length*100+'%'}
function chips(){$('#chips').innerHTML=S.map((l,i)=>`<button class="chip${i===cur?' on':''}${P.done[l.id]?' d':''}" data-i="${i}">${l.id}. ${l.t}</button>`).join('')}
function ui(){
$('#pl').innerHTML=R.map((r,a)=>r.map((c,t)=>{const v=a*5+t;return`<button class="sw" data-v="${v}" style="background:${c}" aria-label="Ramp ${a+1}, tone ${t+1}" aria-pressed="${v===col}"></button>`}).join('')).join('');
document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===tool));
$('#sq').setAttribute('aria-pressed',cv.classList.contains('gray'))}
function draw(){
const s=cv.width/W;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=g[y*W+x];ctx.fillStyle=v<0?((x+y)%2?'#c9cfdb':'#dfe3ec'):C(v);ctx.fillRect(x*s,y*s,s,s)}
ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=1;ctx.beginPath();
for(let k=1;k<W;k++){ctx.moveTo(k*s,0);ctx.lineTo(k*s,cv.height)}
for(let k=1;k<H;k++){ctx.moveTo(0,k*s);ctx.lineTo(cv.width,k*s)}
ctx.stroke();
ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(255,210,63,.95)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,HZ*s);ctx.lineTo(cv.width,HZ*s);ctx.stroke();ctx.setLineDash([]);
const q=$('#pv').getContext('2d');q.clearRect(0,0,W,H);
g.forEach((v,i)=>{if(v>=0){q.fillStyle=C(v);q.fillRect(i%W,i/W|0,1,1)}})}
function check(){
const r=L.obj.map(o=>!!o[1]());
$('#ob').innerHTML=L.obj.map((o,i)=>`<li class="${r[i]?'ok':''}">${o[0]}</li>`).join('');
const all=r.every(Boolean);$('#win').hidden=!all;
$('#nx').textContent=cur<S.length-1?'Next lesson':'Start over';
if(all&&!P.done[L.id]){P.done[L.id]=1;sv();head();chips()}}
function load(i){
cur=i;P.cur=i;L=S[i];hist=[];sqd=false;
cv.classList.remove('gray');$('#pv').classList.remove('gray');
$('#lv').textContent='Lesson '+L.id+' of '+S.length;$('#lt').textContent=L.t;$('#ll').textContent=L.learn;$('#lp').textContent='Tip: '+L.tip;
ui();chips();draw();check();sv()}
function flood(a,b){const t=g[b*W+a];if(t===col)return;const st=[[a,b]];
while(st.length){const[x,y]=st.pop();if(x<0||y<0||x>=W||y>=H||g[y*W+x]!==t)continue;g[y*W+x]=col;st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1])}}
const dab=(x,y)=>{const n=dc++,v=n%3===2?(col%5<4?col+1:col-1):col;for(let k=-1;k<=1;k++){const X=x+k*dir[0],Y=y+k*dir[1];if(X>=0&&Y>=0&&X<W&&Y<H)g[Y*W+X]=v}};
function stroke(a,b,c,e,first){
const dx=c-a,dy=e-b;
if(tool==='stroke'&&(dx||dy)){const an=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*Math.PI/4;dir=[Math.round(Math.cos(an)),Math.round(Math.sin(an))]}
const m=Math.max(Math.abs(dx),Math.abs(dy))||1;
for(let t=tool==='stroke'&&!first?1:0;t<=m;t++){const x=Math.round(a+dx*t/m),y=Math.round(b+dy*t/m),i=y*W+x;
if(tool==='fill'){if(first)flood(x,y)}
else if(tool==='pick'){if(g[i]>=0)col=g[i]}
else if(tool==='erase')g[i]=-1;
else if(tool==='stroke'){if(first||++sc%4===0)dab(x,y)}
else g[i]=col}
draw();check()}
function rect(a,b,c,e){g.splice(0,W*H,...base);
for(let y=Math.min(b,e);y<=Math.max(b,e);y++)for(let x=Math.min(a,c);x<=Math.max(a,c);x++)g[y*W+x]=col;
draw();check()}
function demo(){snap();g.fill(-1);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v;
if(y<HZ){const f=Math.sin(x*.2+Math.sin(y*.4)*2)+Math.cos(y*.55-x*.12);v=Math.max(0,Math.min(4,Math.round(.3+y/HZ*1.6+f*.8)))}
else{const w=(x+y)%4;v=w<2?17:w<3?18:7}
g[y*W+x]=v}
for(const[sx0,sy0]of[[12,6],[34,10],[53,5]])for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.hypot(dx,dy),X=sx0+dx,Y=sy0+dy;if(X<0||X>=W||Y<0||Y>=HZ)continue;if(d<=1.2)g[Y*W+X]=9;else if(d<=2.2)g[Y*W+X]=8;else if(d<=4)g[Y*W+X]=(X+Y)%2?4:3}
for(const x0 of[26,38,47]){for(let y=30;y<37;y++)for(let x=x0;x<x0+8;x++)g[y*W+x]=(x+y)%5?21:20;for(const[wx,wy]of[[x0+1,32],[x0+5,32],[x0+3,34]]){g[wy*W+wx]=9;g[wy*W+wx+1]=8}}
for(let y=10;y<39;y++){const hw=Math.round(Math.sin((y-10)/28*Math.PI)*4.5)+1,cx=14+Math.round(Math.sin(y*.45)*1.5);for(let x=cx-hw;x<=cx+hw;x++)g[y*W+x]=(x*2+y)%5<2?12:(x+y)%2?11:10}
draw();check();save()}
const at=e=>{const r=cv.getBoundingClientRect(),f=(v,o,s,n)=>Math.max(0,Math.min(n-1,Math.floor((v-o)/s*n)));return[f(e.clientX,r.left,r.width,W),f(e.clientY,r.top,r.height,H)]};
cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);snap();dn=true;sc=0;[lx,lz]=at(e);sx=lx;sy=lz;base=g.slice();if(tool==='rect')rect(sx,sy,sx,sy);else stroke(lx,lz,lx,lz,true)};
cv.onpointermove=e=>{if(!dn)return;const[x,y]=at(e);if(tool==='rect')rect(sx,sy,x,y);else stroke(lx,lz,x,y,false);lx=x;lz=y};
cv.onpointerup=cv.onpointercancel=()=>{if(dn){dn=false;save();ui()}};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b)load(+b.dataset.i)};
$('#pl').onclick=e=>{const b=e.target.closest('.sw');if(b){col=+b.dataset.v;if(!['pen','stroke','rect','fill'].includes(tool))tool='pen';ui()}};
$('#tl').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.t)tool=b.dataset.t;
else if(b.id==='un')undo();
else if(b.id==='ex')demo();
else if(b.id==='cl'){snap();g.fill(-1);draw();check();save()}
else if(b.id==='sq'){const on=cv.classList.toggle('gray');$('#pv').classList.toggle('gray',on);if(on)sqd=true;check()}
ui()};
$('#nx').onclick=()=>load((cur+1)%S.length);
head();load(cur);
</script>
</body>
</html>
